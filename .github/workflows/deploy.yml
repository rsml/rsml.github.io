name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: withastro/action@v6   # detects pnpm, runs build, uploads dist as the Pages artifact
        # node-version input still accepted in v6; default is now 24 (meets Astro 6 requirement of >= 22.12)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Cloudflare fronts this domain and caches assets for hours, so a deploy
      # is not visible at the edge until the TTL lapses. That matters most for
      # the social cards: LinkedIn and X scrape a card once and cache it their
      # side, so a stale edge copy gets frozen into their caches and outlives
      # the purge. Token is scoped to Cache Purge on this zone only.
      - name: Purge Cloudflare edge cache
        env:
          CF_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
        run: |
          if [ -z "$CF_CACHE_TOKEN" ]; then
            echo "CLOUDFLARE_CACHE_TOKEN not set; skipping cache purge."
            exit 0
          fi
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/6805cb853e2228bf92a3c7dded8e6b73/purge_cache" \
            -H "Authorization: Bearer $CF_CACHE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -qE '"success":[[:space:]]*true' || { echo "Cache purge failed"; exit 1; }
          echo "Cloudflare edge cache purged."

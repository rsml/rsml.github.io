<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎈 Bray's Birthday Balloon Adventure! 🎈</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            background: #000;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* ── shadcn-inspired HUD ── */
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(9,9,11,.72);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;
            padding: 12px 18px;
            color: #fafafa;
            box-shadow: 0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
            min-width: 210px;
        }
        .hud-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            color: rgba(161,161,170,1);
            margin-bottom: 6px;
        }
        .hud-value {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud-value .icon { font-size: 20px; }

        /* progress track */
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,.08);
            border-radius: 999px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #f97316, #facc15);
            transition: width .35s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 0 8px rgba(249,115,22,.5);
        }

        /* hearts row */
        .hearts-row {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }
        .heart {
            width: 22px; height: 22px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            background: rgba(255,255,255,.06);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,.06);
            transition: all .25s;
        }
        .heart.active {
            background: rgba(239,68,68,.18);
            border-color: rgba(239,68,68,.35);
            box-shadow: 0 0 10px rgba(239,68,68,.25);
        }
        .heart.lost { opacity: .22; filter: grayscale(1); }

        /* badge chip */
        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: rgba(34,197,94,.12);
            color: #4ade80;
            border: 1px solid rgba(34,197,94,.2);
            margin-top: 6px;
        }
        .hud-badge.danger {
            background: rgba(239,68,68,.12);
            color: #f87171;
            border-color: rgba(239,68,68,.2);
        }

        /* ── Message overlay ── */
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            display: none;
            text-align: center;
        }
        #message .msg-card {
            background: rgba(9,9,11,.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 20px;
            padding: 48px 64px;
            box-shadow: 0 0 60px rgba(0,0,0,.6), 0 0 120px rgba(0,0,0,.3);
            animation: msgIn .4s cubic-bezier(.16,1,.3,1);
        }
        #message .msg-text {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fde68a, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #message .msg-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            color: rgba(161,161,170,1);
            margin-top: 12px;
            letter-spacing: 1px;
        }
        @keyframes msgIn {
            from { transform: scale(.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ── Instructions bar ── */
        #instructions {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(9,9,11,.64);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 10px;
            padding: 10px 22px;
            color: rgba(161,161,170,1);
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            letter-spacing: .8px;
            display: flex;
            gap: 18px;
            align-items: center;
        }
        #instructions kbd {
            display: inline-block;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 5px;
            padding: 1px 7px;
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            color: #fafafa;
            margin: 0 2px;
        }
        #instructions .sep {
            width: 1px;
            height: 16px;
            background: rgba(255,255,255,.1);
        }

        /* ── Banner ── */
        #birthday-banner {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #f97316, #facc15, #4ade80, #38bdf8, #a78bfa, #f97316);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: bannerShift 4s linear infinite;
            text-shadow: none;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
        }
        @keyframes bannerShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* ── Difficulty Select Screen ── */
        #difficulty-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 30%, rgba(30,30,50,0.95) 0%, rgba(5,5,12,0.98) 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            animation: screenFadeIn .5s ease-out;
        }
        @keyframes screenFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .diff-title {
            font-family: 'Orbitron', monospace;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #facc15, #f97316, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 20px rgba(249,115,22,.4));
        }
        .diff-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            color: rgba(161,161,170,.8);
            letter-spacing: 2px;
            margin-bottom: 40px;
        }
        .diff-grid {
            display: flex;
            gap: 14px;
        }
        .diff-btn {
            position: relative;
            width: 120px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px;
            padding: 22px 16px 18px;
            cursor: pointer;
            transition: all .25s cubic-bezier(.4,0,.2,1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            outline: none;
        }
        .diff-btn:hover, .diff-btn:focus-visible {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.18);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);
        }
        .diff-btn:active { transform: translateY(-1px); }
        .diff-number {
            font-family: 'Orbitron', monospace;
            font-size: 32px;
            font-weight: 900;
            line-height: 1;
        }
        .diff-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: rgba(161,161,170,.9);
        }
        .diff-dots {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .diff-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            transition: background .2s;
        }
        .diff-dot.active { background: currentColor; }

        .diff-btn[data-level="1"] .diff-number { color: #4ade80; }
        .diff-btn[data-level="1"] .diff-dot.active { background: #4ade80; }
        .diff-btn[data-level="1"]:hover { border-color: rgba(74,222,128,.35); box-shadow: 0 12px 32px rgba(0,0,0,.4), 0 0 20px rgba(74,222,128,.12); }

        .diff-btn[data-level="2"] .diff-number { color: #38bdf8; }
        .diff-btn[data-level="2"] .diff-dot.active { background: #38bdf8; }
        .diff-btn[data-level="2"]:hover { border-color: rgba(56,189,248,.35); box-shadow: 0 12px 32px rgba(0,0,0,.4), 0 0 20px rgba(56,189,248,.12); }

        .diff-btn[data-level="3"] .diff-number { color: #facc15; }
        .diff-btn[data-level="3"] .diff-dot.active { background: #facc15; }
        .diff-btn[data-level="3"]:hover { border-color: rgba(250,204,21,.35); box-shadow: 0 12px 32px rgba(0,0,0,.4), 0 0 20px rgba(250,204,21,.12); }

        .diff-btn[data-level="4"] .diff-number { color: #f97316; }
        .diff-btn[data-level="4"] .diff-dot.active { background: #f97316; }
        .diff-btn[data-level="4"]:hover { border-color: rgba(249,115,22,.35); box-shadow: 0 12px 32px rgba(0,0,0,.4), 0 0 20px rgba(249,115,22,.12); }

        .diff-btn[data-level="5"] .diff-number { color: #ef4444; }
        .diff-btn[data-level="5"] .diff-dot.active { background: #ef4444; }
        .diff-btn[data-level="5"]:hover { border-color: rgba(239,68,68,.35); box-shadow: 0 12px 32px rgba(0,0,0,.4), 0 0 20px rgba(239,68,68,.12); }

        .diff-footer {
            margin-top: 32px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            color: rgba(161,161,170,.45);
            letter-spacing: 1px;
        }
        .diff-footer kbd {
            display: inline-block;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 4px;
            padding: 1px 6px;
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            color: rgba(161,161,170,.7);
        }
    </style>
</head>
<body>
    <!-- Difficulty Selection -->
    <div id="difficulty-screen">
        <div class="diff-title">Choose Difficulty</div>
        <div class="diff-subtitle">How fast can you handle it?</div>
        <div class="diff-grid">
            <button class="diff-btn" data-level="1" onclick="startGame(1)">
                <div class="diff-number">1</div>
                <div class="diff-label">Chill</div>
                <div class="diff-dots"><div class="diff-dot active"></div><div class="diff-dot"></div><div class="diff-dot"></div><div class="diff-dot"></div><div class="diff-dot"></div></div>
            </button>
            <button class="diff-btn" data-level="2" onclick="startGame(2)">
                <div class="diff-number">2</div>
                <div class="diff-label">Easy</div>
                <div class="diff-dots"><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot"></div><div class="diff-dot"></div><div class="diff-dot"></div></div>
            </button>
            <button class="diff-btn" data-level="3" onclick="startGame(3)">
                <div class="diff-number">3</div>
                <div class="diff-label">Medium</div>
                <div class="diff-dots"><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot"></div><div class="diff-dot"></div></div>
            </button>
            <button class="diff-btn" data-level="4" onclick="startGame(4)">
                <div class="diff-number">4</div>
                <div class="diff-label">Fast</div>
                <div class="diff-dots"><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot"></div></div>
            </button>
            <button class="diff-btn" data-level="5" onclick="startGame(5)">
                <div class="diff-number">5</div>
                <div class="diff-label">Brutal</div>
                <div class="diff-dots"><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot active"></div><div class="diff-dot active"></div></div>
            </button>
        </div>
        <div class="diff-footer">Press <kbd>1</kbd> – <kbd>5</kbd> or click to select</div>
    </div>

    <div id="birthday-banner">🎉 HAPPY BIRTHDAY BRAY 🎉</div>

    <div id="hud">
        <div class="hud-card">
            <div class="hud-label">Balloons Collected</div>
            <div class="hud-value">
                <span class="icon">🎈</span>
                <span id="score">0</span>
                <span style="font-size:13px;color:rgba(161,161,170,1);font-weight:500">/ 8</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress" style="width:0%"></div>
            </div>
        </div>
        <div class="hud-card">
            <div class="hud-label">Shields</div>
            <div class="hearts-row" id="hearts">
                <div class="heart active">❤️</div>
                <div class="heart active">❤️</div>
                <div class="heart active">❤️</div>
            </div>
            <div class="hud-badge" id="status-badge">
                <span style="font-size:8px">●</span> Operational
            </div>
        </div>
    </div>

    <div id="message">
        <div class="msg-card">
            <div class="msg-text" id="msg-text"></div>
            <div class="msg-sub" id="msg-sub"></div>
        </div>
    </div>

    <div id="instructions">
        <span><kbd>ARROWS</kbd> Move + Turn</span>
        <div class="sep"></div>
        <span><kbd>SPACE</kbd> Jump</span>
        <div class="sep"></div>
        <span style="color:#f87171">⚠ Dodge LEGO blasters!</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ══════════════════════════════════════════
    //  GAME SETUP
    // ══════════════════════════════════════════
    const canvas = document.getElementById('gameCanvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 40, 70);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xffffcc, 0.8);
    sunLight.position.set(50, 100, 50);
    sunLight.castShadow = true;
    sunLight.shadow.camera.left = -100;
    sunLight.shadow.camera.right = 100;
    sunLight.shadow.camera.top = 100;
    sunLight.shadow.camera.bottom = -100;
    scene.add(sunLight);

    // ══════════════════════════════════════════
    //  CLOUDS
    // ══════════════════════════════════════════
    (function createClouds() {
        const mat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.7 });
        for (let i = 0; i < 8; i++) {
            const g = new THREE.Group();
            for (let j = 0; j < 3 + Math.floor(Math.random() * 4); j++) {
                const b = new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*2, 1.5, 2+Math.random()*2), mat);
                b.position.set((Math.random()-.5)*4, Math.random()*.5, (Math.random()-.5)*4);
                g.add(b);
            }
            g.position.set((Math.random()-.5)*80, 25+Math.random()*10, (Math.random()-.5)*80);
            scene.add(g);
        }
    })();

    // ══════════════════════════════════════════
    //  GAME STATE
    // ══════════════════════════════════════════
    let score = 0;
    let lives = 3;
    let invincible = false;
    let gameEnded = false;
    const totalBalloons = 8;
    const blockSize = 2;
    const worldSize = 30;

    // Playable bounds stay inside the last terrain ring (prevents edge weirdness)
    const PLAY_BOUNDS = worldSize - blockSize;

    // Collision tuning
    const TREE_COLLISION_RADIUS = 1.35; // tighter trunk hitbox so you don't get "stuck"
    const TREE_EDGE_MARGIN = 4;
    const TREE_SOUTH_EDGE_MARGIN = 6; // extra buffer on the bottom/south edge
    const PLAYER_COLLISION_RADIUS = 0.8; // keeps shoulders inside walls/edges
    const ROBOT_COLLISION_RADIUS = 0.75;


    // Balloon pickup tuning (magnet feel)
    const BALLOON_MAGNET_RADIUS = 5.0;
    const BALLOON_MAGNET_STRENGTH = 0.12; // higher = stronger suction
    const BALLOON_PICKUP_RADIUS = 3.0;
    const BALLOON_PICKUP_Y_TOL = 3.5;

    // ══════════════════════════════════════════
    //  LEGO TEXTURE HELPERS (raised look)
    // ══════════════════════════════════════════
    function makeLegoStudTexture(baseColor, studColor, highlightColor, size) {
        const c = document.createElement('canvas');
        c.width = c.height = size || 64;
        const ctx = c.getContext('2d');
        // Base
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, c.width, c.height);
        // Top-edge highlight for raised look
        ctx.fillStyle = highlightColor || 'rgba(255,255,255,0.18)';
        ctx.fillRect(0, 0, c.width, 3);
        ctx.fillRect(0, 0, 3, c.height);
        // Bottom-edge shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, c.height - 3, c.width, 3);
        ctx.fillRect(c.width - 3, 0, 3, c.height);
        // Studs (2×2 grid)
        ctx.fillStyle = studColor || 'rgba(0,0,0,0.12)';
        const s = c.width;
        for (let i = 0; i < 2; i++) {
            for (let j = 0; j < 2; j++) {
                const cx = s * 0.25 + i * s * 0.5;
                const cy = s * 0.25 + j * s * 0.5;
                // stud shadow
                ctx.beginPath();
                ctx.arc(cx, cy+1, s*0.12, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(0,0,0,0.18)';
                ctx.fill();
                // stud body
                ctx.beginPath();
                ctx.arc(cx, cy, s*0.12, 0, Math.PI*2);
                ctx.fillStyle = studColor || baseColor;
                ctx.fill();
                // stud highlight
                ctx.beginPath();
                ctx.arc(cx - s*0.03, cy - s*0.03, s*0.06, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();
            }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        return tex;
    }

    function makeLegoSideTexture(baseColor, size) {
        const c = document.createElement('canvas');
        c.width = c.height = size || 64;
        const ctx = c.getContext('2d');
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, c.width, c.height);
        // Raised edge highlights
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, 0, c.width, 2);
        ctx.fillRect(0, 0, 2, c.height);
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, c.height-2, c.width, 2);
        ctx.fillRect(c.width-2, 0, 2, c.height);
        // Horizontal mortar line
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.fillRect(0, c.height/2 - 1, c.width, 2);
        const tex = new THREE.CanvasTexture(c);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        return tex;
    }

    // ══════════════════════════════════════════
    //  TERRAIN
    // ══════════════════════════════════════════
    // Map any continuous (x,z) to the nearest terrain column center so collision/grounding
    // always matches the actual block grid (fixes occasional one-frame "dip through floor" artifacts).
    function snapToTerrainGrid(v) {
        return Math.floor((v + blockSize / 2) / blockSize) * blockSize;
    }

    function getHeight(x, z) {
        const sx = snapToTerrainGrid(x);
        const sz = snapToTerrainGrid(z);
        const noise1 = Math.sin(sx * 0.08) * Math.cos(sz * 0.08);
        const noise2 = Math.sin(sx * 0.04) * Math.cos(sz * 0.05);
        return Math.max(0, Math.floor((noise1 * 1 + noise2 * 1 + 3)));
    }
    window.getTerrainHeight = getHeight;

    // Returns the Y of the TOP SURFACE of the terrain at (x,z)
    function getTerrainTopY(x, z) {
        const h = getHeight(x, z);
        return h * blockSize + blockSize / 2; // top of highest block
    }

    (function createTerrain() {
        const grassTex = makeLegoStudTexture('#4CBB17', '#3AA00F', 'rgba(255,255,255,0.2)', 64);
        const dirtTex = makeLegoSideTexture('#D4A373', 64);
        const stoneTex = makeLegoSideTexture('#9BA0A8', 64);

        const grassMats = [
            new THREE.MeshPhongMaterial({ map: dirtTex }),
            new THREE.MeshPhongMaterial({ map: dirtTex }),
            new THREE.MeshPhongMaterial({ map: grassTex }),
            new THREE.MeshPhongMaterial({ map: dirtTex }),

    function applyDifficulty(level) {
        const multipliers = { 1: 0.4, 2: 0.5, 3: 0.6, 4: 0.7, 5: 0.8 };
        speedMultiplier = (multipliers[level] || 0.6) * GLOBAL_SPEED_MULT;

        // Scale speeds (higher multiplier = faster)
        gamePlayerSpeed = BASE_PLAYER_SPEED * speedMultiplier;
        GRAVITY = BASE_GRAVITY * speedMultiplier;
        FAST_FALL_GRAVITY = BASE_FAST_FALL * speedMultiplier;
        JUMP_VELOCITY = BASE_JUMP * Math.sqrt(speedMultiplier); // sqrt so jump height scales reasonably
        gameRobotSpeed = BASE_ROBOT_SPEED * speedMultiplier * ROBOT_SPEED_MULT;
        gameRobotWander = BASE_ROBOT_WANDER * speedMultiplier * ROBOT_SPEED_MULT;
        gameLaserSpeed = BASE_LASER_SPEED * speedMultiplier * LASER_SPEED_MULT;
        // Faster difficulty = shorter interval between shots
        gameLaserInterval = BASE_LASER_INTERVAL / speedMultiplier;

let robotVoice = null;
function selectRobotVoice() {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
    // macOS "Zarvox" is wonderfully robotic if present
    robotVoice =
        voices.find(v => /zarvox/i.test(v.name)) ||
        voices.find(v => /robot/i.test(v.name)) ||
        voices.find(v => /en/i.test(v.lang)) ||
        voices[0] ||
        null;
}
if ('speechSynthesis' in window) {
    selectRobotVoice();
    speechSynthesis.onvoiceschanged = selectRobotVoice;
}

function robotSay(text) {
    if (!('speechSynthesis' in window)) return;
    // Don't spam / overlap
    if (speechSynthesis.speaking || speechSynthesis.pending) return;

    const u = new SpeechSynthesisUtterance(text);
    if (robotVoice) u.voice = robotVoice;
    u.lang = (robotVoice && robotVoice.lang) ? robotVoice.lang : 'en-US';
    u.rate = 1.03;
    u.pitch = 0.55;
    u.volume = 1.0;

    // Tiny delay to avoid stepping on other audio in some browsers
    setTimeout(() => speechSynthesis.speak(u), 30);
}

function randRange(min, max) { return min + Math.random() * (max - min); }

    if (gameEnded || !gameStarted) return;

    const now = Date.now();
    if (now < nextRobotTauntTime) return;

    // Prefer taunts when at least one robot is near-ish
    let nearest = null;
    let best = Infinity;
    for (let i = 0; i < robots.length; i++) {
        const d = robots[i].position.distanceTo(player.position);
        if (d < best) { best = d; nearest = robots[i]; }
    }

    if (nearest && best < 26) {
        const line = ROBOT_TAUNTS[Math.floor(Math.random() * ROBOT_TAUNTS.length)];
        robotSay(line);
    }

    nextRobotTauntTime = now + randRange(6000, 10000);
}



    function playLaserSound() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function playHitSound() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        setTimeout(() => {
            const o2 = audioCtx.createOscillator();
            const g2 = audioCtx.createGain();
            o2.connect(g2); g2.connect(audioCtx.destination);
            o2.frequency.value = 400;
            g2.gain.setValueAtTime(0.2, audioCtx.currentTime);
            g2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            o2.start(); o2.stop(audioCtx.currentTime + 0.1);
        }, 100);
    }



function playRobotBumpSound() {
    const now = audioCtx.currentTime;

    // Low "thunk"
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.45, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.18);

    // Metallic noise burst (robot clank)
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.085);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        const env = 1 - (i / bufferSize);
        data[i] = (Math.random() * 2 - 1) * env;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(900, now);
    bp.Q.setValueAtTime(6, now);

    const nGain = audioCtx.createGain();
    nGain.gain.setValueAtTime(0.28, now);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

    noise.connect(bp);
    bp.connect(nGain);
    nGain.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.12);
}

    function playBalloonSound(noteIndex) {
        const idx = Math.max(0, Math.min(BALLOON_SCALE_FREQS.length - 1, (noteIndex | 0)));
        const base = BALLOON_SCALE_FREQS[idx];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.connect(gain); 
        gain.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(base, now);
        // Tiny "chirp" up for a LEGO-pop feel
        osc.frequency.exponentialRampToValueAtTime(base * 1.06, now + 0.08);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.38, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.20);

        osc.start(now); 
        osc.stop(now + 0.22);
    }

    function createLaser(robot) {
        // Direction from robot → player (fixed at fire time)
        const dir = new THREE.Vector3(
            player.position.x - robot.position.x,
            player.position.y + 1.2 - robot.position.y - 1.5,
            player.position.z - robot.position.z
        ).normalize();

        const g = new THREE.Group();

        // LEGO 1×1 brick projectile
        const brickTex = makeLegoStudTexture('#FF2020', '#CC1010', 'rgba(255,255,255,0.3)', 32);
        const brickMat = new THREE.MeshPhongMaterial({ map: brickTex, flatShading: true, shininess: 90, emissive: 0x440000, emissiveIntensity: 0.5 });

        // Main brick body
        const brick = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), brickMat);
        g.add(brick);

        // Stud on top of the brick
        const studGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.1, 8);
        const studMesh = new THREE.Mesh(studGeo, brickMat);
        studMesh.position.y = 0.3;
        g.add(studMesh);

        // Glow trail
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xFF4444, transparent: true, opacity: 0.4 });
        const glow = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.8), glowMat);
        glow.position.z = -0.5;
        g.add(glow);

        // Point the brick in travel direction
        const angle = Math.atan2(dir.x, dir.z);
        g.rotation.y = angle;

        // Start from robot's chest area
        g.position.set(
            robot.position.x + dir.x * 1.2,
            robot.position.y + 1.5,
            robot.position.z + dir.z * 1.2
        );

        g.userData.velocity = dir.clone().multiplyScalar(gameLaserSpeed);
        g.userData.lifetime = 0;

        scene.add(g);
        lasers.push(g);
        playLaserSound();
    }

    function updateLasers() {
        for (let i = lasers.length - 1; i >= 0; i--) {
            const laser = lasers[i];
            laser.position.add(laser.userData.velocity);
            laser.userData.lifetime++;

            // Spin the brick as it flies
            laser.rotation.x += 0.15 * GLOBAL_SPEED_MULT;
            laser.rotation.z += 0.1 * GLOBAL_SPEED_MULT;

            // Terrain collision
            const terrainTop = getTerrainTopY(laser.position.x, laser.position.z);
            if (laser.position.y <= terrainTop + 0.3) {
                scene.remove(laser);
                lasers.splice(i, 1);
                continue;
            }

            // Out of bounds / too old
            if (Math.abs(laser.position.x) > 35 || Math.abs(laser.position.z) > 35 || laser.userData.lifetime > 200) {
                scene.remove(laser);
                lasers.splice(i, 1);
                continue;
            }

            // Player collision
            if (!invincible) {
                const dist = laser.position.distanceTo(player.position);
                if (dist < 1.5) {
                    scene.remove(laser);
                    lasers.splice(i, 1);
                    hitPlayer('laser');
                }
            }
        }
    }

    // ══════════════════════════════════════════

    const cam = { cx: 0, cy: 0, cz: 0, lx: 0, ly: 0, lz: 0 };

    // ══════════════════════════════════════════
    //  HIT PLAYER
    // ══════════════════════════════════════════
    function hitPlayer(source = 'laser') {
        lives--;
        invincible = true;
        if (source === 'robot') playRobotBumpSound(); else playHitSound();
        updateHUD();

        let flashCount = 0;
        const flashInterval = setInterval(() => {
            player.visible = !player.visible;
            flashCount++;
            if (flashCount > 6) {
                clearInterval(flashInterval);
                player.visible = true;
                invincible = false;
            }
        }, 200);

        if (lives <= 0) {
            gameEnded = true;
            showMessage('GAME OVER', 'Press R to restart!');
        }
    }

    // ══════════════════════════════════════════
    //  ROBOT PHYSICS HELPER
    // ══════════════════════════════════════════
    function updateRobotPhysics(robot) {
        const ud = robot.userData;

        // Apply gravity
        if (!ud.isGrounded) {
            ud.velocityY += (ud.velocityY < 0 ? FAST_FALL_GRAVITY : GRAVITY);
        }
        robot.position.y += ud.velocityY;

        // Ground check
        const topY = getTerrainTopY(robot.position.x, robot.position.z);
        const groundLevel = topY + PLAYER_FOOT_OFFSET;

        if (robot.position.y <= groundLevel) {
            robot.position.y = groundLevel;
            ud.velocityY = 0;
            ud.isGrounded = true;
        } else {
            ud.isGrounded = false;
        }

        if (ud.jumpCooldown > 0) ud.jumpCooldown--;
    }

    function tryRobotJump(robot, targetX, targetZ) {
        const ud = robot.userData;
        if (!ud.isGrounded || ud.jumpCooldown > 0) return;

        const currentTop = getTerrainTopY(robot.position.x, robot.position.z);
        const targetTop = getTerrainTopY(targetX, targetZ);

        if (targetTop - currentTop > MAX_STEP_HEIGHT) {
            ud.velocityY = JUMP_VELOCITY * 0.9;
            ud.isGrounded = false;
            ud.jumpCooldown = 30;
        }
    }


    // ══════════════════════════════════════════
    //  COLLISION RESOLUTION (anti-stuck)
    // ══════════════════════════════════════════
    function resolveTreeCollisions(pos, radius = 0) {
        for (const tp of window.treePositions) {
            const cx = tp[0], cz = tp[1];
            const dx = pos.x - cx;
            const dz = pos.z - cz;
            const dist = Math.sqrt(dx*dx + dz*dz);
            if (dist < TREE_COLLISION_RADIUS) {
                const nx = dist > 1e-6 ? dx / dist : 1;
                const nz = dist > 1e-6 ? dz / dist : 0;
                const push = (TREE_COLLISION_RADIUS - dist) + 0.001;
                pos.x += nx * push;
                pos.z += nz * push;
            }
        }
        // Clamp after pushing (keeps you inside the terrain ring)
        pos.x = Math.max(-PLAY_BOUNDS + radius, Math.min(PLAY_BOUNDS - radius, pos.x));
        pos.z = Math.max(-PLAY_BOUNDS + radius, Math.min(PLAY_BOUNDS - radius, pos.z));
    }

    // ══════════════════════════════════════════
    //  MAIN GAME LOOP
    // ══════════════════════════════════════════
    function animate() {
        requestAnimationFrame(animate);

        // Don't run game logic until difficulty is chosen
        if (!gameStarted) {
            renderer.render(scene, camera);
            return;
        }

        // Freeze game logic when finished
        if (gameEnded) {
            renderer.render(scene, camera);
            return;
        }

        // ── Player movement ──
        const moveDir = new THREE.Vector3();
        let turnDirection = 0;

        if (keys['w']) moveDir.z -= 1;
        if (keys['s']) moveDir.z += 1;
        if (keys['a']) moveDir.x -= 1;
        if (keys['d']) moveDir.x += 1;

        if (keys['arrowup']) {
            moveDir.x += Math.sin(player.rotation.y);
            moveDir.z += Math.cos(player.rotation.y);
        }
        if (keys['arrowdown']) {
            moveDir.x -= Math.sin(player.rotation.y);
            moveDir.z -= Math.cos(player.rotation.y);
        }
        if (keys['arrowleft']) turnDirection = 1;
        if (keys['arrowright']) turnDirection = -1;

        // ── Mario jump ──
        if (isGrounded) coyoteTimer = COYOTE_TIME;
        else coyoteTimer = Math.max(0, coyoteTimer - 1);

        if (keys[' '] && coyoteTimer > 0 && playerVelocityY <= 0) {
            playerVelocityY = JUMP_VELOCITY;
            isGrounded = false;
            coyoteTimer = 0;
        }

        // Variable jump height: cut velocity when space released (Mario feel)
        if (!jumpHeld && playerVelocityY > 0.1) {
            playerVelocityY *= 0.65;
        }

        if (turnDirection !== 0) player.rotation.y += turnDirection * 0.05 * GLOBAL_SPEED_MULT;

        if (moveDir.length() > 0) {
            moveDir.normalize().multiplyScalar(gamePlayerSpeed);

            const newX = player.position.x + moveDir.x;
            const newZ = player.position.z + moveDir.z;

            // ── Terrain step check (prevent walking up) ──
            const currentTopY = getTerrainTopY(player.position.x, player.position.z);
            const nextTopY = getTerrainTopY(newX, newZ);
            const heightDiff = nextTopY - currentTopY;

            let canMove = true;

            // Block horizontal movement if terrain is too high AND player is grounded
            if (heightDiff > MAX_STEP_HEIGHT && isGrounded) {
                canMove = false;
            }
            // Also block if in air but feet would clip into terrain
            if (!isGrounded && nextTopY + PLAYER_FOOT_OFFSET > player.position.y + 0.2) {
                canMove = false;
            }

            if (canMove) {
                player.position.x = newX;
                player.position.z = newZ;
            }

            player.position.x = Math.max(-PLAY_BOUNDS + PLAYER_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - PLAYER_COLLISION_RADIUS, player.position.x));
            player.position.z = Math.max(-PLAY_BOUNDS + PLAYER_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - PLAYER_COLLISION_RADIUS, player.position.z));
            resolveTreeCollisions(player.position, PLAYER_COLLISION_RADIUS);

            if (keys['w'] || keys['s'] || keys['a'] || keys['d']) {
                player.rotation.y = Math.atan2(moveDir.x, moveDir.z);
            }
        }

        // Always resolve any slight overlaps with trees (prevents rare stuck/jitter cases)
        resolveTreeCollisions(player.position, PLAYER_COLLISION_RADIUS);

        // ── Gravity (Mario-style: faster fall) ──
        const currentGravity = (playerVelocityY < 0 || !jumpHeld) ? FAST_FALL_GRAVITY : GRAVITY;
        playerVelocityY += currentGravity;
        player.position.y += playerVelocityY;

        const terrainTop = getTerrainTopY(player.position.x, player.position.z);
        const groundLevel = terrainTop + PLAYER_FOOT_OFFSET;

        if (player.position.y <= groundLevel) {
            player.position.y = groundLevel;
            playerVelocityY = 0;
            isGrounded = true;
        } else {
            isGrounded = false;
        }

        // ── Walk animation (player legs) ──
        const pw = player.userData.walk;
        if (pw) {
            const dxw = player.position.x - pw.lastX;
            const dzw = player.position.z - pw.lastZ;
            const dist = Math.sqrt(dxw*dxw + dzw*dzw);
            pw.lastX = player.position.x;
            pw.lastZ = player.position.z;

            if (isGrounded && dist > 0.0003) {
                pw.phase += dist * 18;
                const swing = Math.sin(pw.phase) * 0.9;
                pw.leftLeg.rotation.x = swing * 0.9;
                pw.rightLeg.rotation.x = -swing * 0.9;
                pw.leftFoot.rotation.x = swing * 0.35;
                pw.rightFoot.rotation.x = -swing * 0.35;
            } else {
                pw.leftLeg.rotation.x *= 0.75;
                pw.rightLeg.rotation.x *= 0.75;
                pw.leftFoot.rotation.x *= 0.75;
                pw.rightFoot.rotation.x *= 0.75;
            }
        }


        // ── Camera ──
        const camDist = 12;
        const camH = 6;
        const camAngle = player.rotation.y;
        const tx = player.position.x - Math.sin(camAngle) * camDist;
        const ty = player.position.y + camH;
        const tz = player.position.z - Math.cos(camAngle) * camDist;
        const sm = 0.2 * GLOBAL_SPEED_MULT;
        cam.cx += (tx - cam.cx) * sm;
        cam.cy += (ty - cam.cy) * sm;
        cam.cz += (tz - cam.cz) * sm;
        cam.cy = Math.min(cam.cy, player.position.y + 10);
        camera.position.set(cam.cx, cam.cy, cam.cz);
        cam.lx += (player.position.x - cam.lx) * sm;
        cam.ly += (player.position.y + 1 - cam.ly) * sm;
        cam.lz += (player.position.z - cam.lz) * sm;
        camera.lookAt(cam.lx, cam.ly, cam.lz);

        // ── Balloons (hover above terrain) ──
        const time = Date.now() * 0.001 * GLOBAL_SPEED_MULT;
        for (let i = balloons.length - 1; i >= 0; i--) {
            const b = balloons[i];

            // Magnet pickup: if you're close, the balloon drifts into you (much easier to grab).
            const dxBase = player.position.x - b.userData.baseX;
            const dzBase = player.position.z - b.userData.baseZ;
            const horizDistBase = Math.sqrt(dxBase*dxBase + dzBase*dzBase);

            if (horizDistBase < BALLOON_MAGNET_RADIUS) {
                const pull = (1 - horizDistBase / BALLOON_MAGNET_RADIUS);
                const step = pull * BALLOON_MAGNET_STRENGTH * GLOBAL_SPEED_MULT;
                b.userData.baseX += dxBase * step;
                b.userData.baseZ += dzBase * step;
                b.userData.baseX = Math.max(-PLAY_BOUNDS + 1, Math.min(PLAY_BOUNDS - 1, b.userData.baseX));
                b.userData.baseZ = Math.max(-PLAY_BOUNDS + 1, Math.min(PLAY_BOUNDS - 1, b.userData.baseZ));
            }

            const bTopY = getTerrainTopY(b.userData.baseX, b.userData.baseZ);
            b.position.set(
                b.userData.baseX,
                bTopY + 2.5 + Math.sin(time * 2 + b.userData.floatOffset) * 0.3,
                b.userData.baseZ
            );
            b.rotation.y += 0.02 * GLOBAL_SPEED_MULT;

            const dx = player.position.x - b.position.x;
            const dz = player.position.z - b.position.z;
            const dy = player.position.y - b.position.y;
            const horizDist = Math.sqrt(dx*dx + dz*dz);

            if (horizDist < BALLOON_PICKUP_RADIUS && Math.abs(dy) < BALLOON_PICKUP_Y_TOL) {
                scene.remove(b);
                balloons.splice(i, 1);
                score++;
                updateHUD();
                playBalloonSound(score - 1);
                if (score >= totalBalloons) { gameEnded = true; showMessage('🎉 YOU WIN!', 'Happy Birthday Bray! Press R to play again!'); }
            }
}

        // ── Robot AI with jump physics ──
        robots.forEach(robot => {
            const ud = robot.userData;
            const distToPlayer = robot.position.distanceTo(player.position);

            // Physics first
            updateRobotPhysics(robot);

            if (distToPlayer < ud.detectionRadius) ud.chasing = true;
            else if (distToPlayer > ud.detectionRadius + 5) ud.chasing = false;

            if (ud.chasing) {
                const dir = new THREE.Vector3(
                    player.position.x - robot.position.x, 0,
                    player.position.z - robot.position.z
                ).normalize();

                const speed = gameRobotSpeed;
                const newX = robot.position.x + dir.x * speed;
                const newZ = robot.position.z + dir.z * speed;

                // Try to jump if terrain ahead is higher
                tryRobotJump(robot, newX, newZ);

                // Check if can move (terrain + tree collision)
                const currentTop = getTerrainTopY(robot.position.x, robot.position.z);
                const nextTop = getTerrainTopY(newX, newZ);
                let canMove = true;

                // Block if too steep AND grounded
                if (nextTop - currentTop > MAX_STEP_HEIGHT && ud.isGrounded) canMove = false;
                if (!ud.isGrounded && nextTop + PLAYER_FOOT_OFFSET > robot.position.y + 0.2) canMove = false;

                const wouldBeDist = Math.sqrt((newX-player.position.x)**2 + (newZ-player.position.z)**2);
                if (canMove && wouldBeDist > 2.5) {
                    robot.position.x = newX;
                    robot.position.z = newZ;
                }

                robot.rotation.y = Math.atan2(dir.x, dir.z);

                // Fire laser
                if (!ud.lastLaserTime || Date.now() - ud.lastLaserTime > gameLaserInterval) {
                    createLaser(robot);
                    ud.lastLaserTime = Date.now();
                }
            } else {
                // Wander
                ud.wanderTimer++;
                if (ud.wanderTimer > 120) {
                    ud.velocity.set((Math.random()-.5)*gameRobotWander, 0, (Math.random()-.5)*gameRobotWander);
                    ud.wanderTimer = 0;
                }

                const newX = robot.position.x + ud.velocity.x;
                const newZ = robot.position.z + ud.velocity.z;

                tryRobotJump(robot, newX, newZ);

                const currentTop = getTerrainTopY(robot.position.x, robot.position.z);
                const nextTop = getTerrainTopY(newX, newZ);
                let canMove = true;
                if (nextTop - currentTop > MAX_STEP_HEIGHT && ud.isGrounded) canMove = false;

                if (canMove) {
                    robot.position.x = newX;
                    robot.position.z = newZ;
                }
            }

            robot.position.x = Math.max(-PLAY_BOUNDS + ROBOT_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - ROBOT_COLLISION_RADIUS, robot.position.x));
            robot.position.z = Math.max(-PLAY_BOUNDS + ROBOT_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - ROBOT_COLLISION_RADIUS, robot.position.z));
            resolveTreeCollisions(robot.position, ROBOT_COLLISION_RADIUS);

            // ── Walk animation (robot legs) ──
            if (ud.leftLeg) {
                const rdx = robot.position.x - (ud.lastX ?? robot.position.x);
                const rdz = robot.position.z - (ud.lastZ ?? robot.position.z);
                const moved = Math.sqrt(rdx*rdx + rdz*rdz);
                ud.lastX = robot.position.x;
                ud.lastZ = robot.position.z;

                if (ud.isGrounded && moved > 0.0002) {
                    ud.walkPhase += moved * 16;
                    const swing = Math.sin(ud.walkPhase) * 0.9;
                    ud.leftLeg.rotation.x = swing * 0.9;
                    ud.rightLeg.rotation.x = -swing * 0.9;
                    ud.leftFoot.rotation.x = swing * 0.3;
                    ud.rightFoot.rotation.x = -swing * 0.3;
                } else {
                    ud.leftLeg.rotation.x *= 0.78;
                    ud.rightLeg.rotation.x *= 0.78;
                    ud.leftFoot.rotation.x *= 0.78;
                    ud.rightFoot.rotation.x *= 0.78;
                }
            }

            // Contact damage
            const heightDiff = Math.abs(robot.position.y - player.position.y);
            if (!invincible && distToPlayer < 2.2 && heightDiff < 2.5) {
                hitPlayer('robot');
            }
        });

        // ── Robot voice taunts ──
        maybeRobotTaunt();

        // ── Lasers ──
        updateLasers();

        renderer.render(scene, camera);
    }

    // ══════════════════════════════════════════
    //  RESIZE
    // ══════════════════════════════════════════
    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    updateHUD();
    animate();
    </script>
</body>
</html>

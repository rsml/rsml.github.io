<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maze Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-shell">
    <header class="hud">
      <div class="logo">🦄 Maze Quest</div>
      <div class="stats">
        <span id="lives">Lives: 5</span>
        <span id="level">Level: 1/3</span>
        <span id="status">Explore the maze</span>
      </div>
      <div class="customize">
        <label>Avatar
          <select id="avatar-select">
            <option value="blue">Blue</option>
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="purple">Purple</option>
          </select>
        </label>
        <label>Hair
          <select id="hair-select">
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
            <option value="white">White</option>
            <option value="pink">Pink</option>
          </select>
        </label>
      </div>
    </header>

    <main>
      <section class="panel story">
        <h2>Trophy Room</h2>
        <p id="story-text">Claim the unicorn trophy and reach the house to place it on the shelf.</p>
        <div class="trophy-shelf">
          <div class="trophy" id="unicorn-trophy">🏆🦄</div>
          <div class="trophy" id="dragon-trophy">🏆🐉</div>
          <div class="trophy" id="phoenix-trophy">🏆🔥</div>
        </div>
        <div class="house" id="house-target">🏠 Shelf</div>
      </section>

      <section class="panel game">
        <canvas id="game" width="640" height="480"></canvas>
        <div class="controls">
          <p>Move with WASD or arrow keys. Touch an animal to claim its soul, then choose to run or attack.</p>
          <div class="buttons">
            <button id="btn-run">Run</button>
            <button id="btn-attack">Attack</button>
          </div>
        </div>
      </section>
    </main>

    <div class="overlay hidden" id="overlay">
      <div class="modal">
        <h2 id="overlay-title">Game Over</h2>
        <p id="overlay-text">You lost all lives.</p>
        <button id="overlay-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>

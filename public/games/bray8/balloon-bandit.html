    // ══════════════════════════════════════════
    //  ROBOT PHYSICS HELPER
    // ══════════════════════════════════════════
    function updateRobotPhysics(robot) {
        const ud = robot.userData;

        // Apply gravity
        if (!ud.isGrounded) {
            ud.velocityY += (ud.velocityY < 0 ? FAST_FALL_GRAVITY : GRAVITY);
        }
        robot.position.y += ud.velocityY;

        // Ground check
        const topY = getTerrainTopY(robot.position.x, robot.position.z);
        const groundLevel = topY + PLAYER_FOOT_OFFSET;

        if (robot.position.y <= groundLevel) {
            robot.position.y = groundLevel;
            ud.velocityY = 0;
            ud.isGrounded = true;
        } else {
            ud.isGrounded = false;
        }

        if (ud.jumpCooldown > 0) ud.jumpCooldown--;
    }

    function tryRobotJump(robot, targetX, targetZ) {
        const ud = robot.userData;
        if (!ud.isGrounded || ud.jumpCooldown > 0) return;

        const currentTop = getTerrainTopY(robot.position.x, robot.position.z);
        const targetTop = getTerrainTopY(targetX, targetZ);

        if (targetTop - currentTop > MAX_STEP_HEIGHT) {
            ud.velocityY = JUMP_VELOCITY * 0.9;
            ud.isGrounded = false;
            ud.jumpCooldown = 30;
        }
    }


    // ══════════════════════════════════════════
    //  COLLISION RESOLUTION (anti-stuck)
    // ══════════════════════════════════════════
    function resolveTreeCollisions(pos, radius = 0) {
        for (const tp of window.treePositions) {
            const cx = tp[0], cz = tp[1];
            const dx = pos.x - cx;
            const dz = pos.z - cz;
            const dist = Math.sqrt(dx*dx + dz*dz);
            if (dist < TREE_COLLISION_RADIUS) {
                const nx = dist > 1e-6 ? dx / dist : 1;
                const nz = dist > 1e-6 ? dz / dist : 0;
                const push = (TREE_COLLISION_RADIUS - dist) + 0.001;
                pos.x += nx * push;
                pos.z += nz * push;
            }
        }
        // Clamp after pushing (keeps you inside the terrain ring)
        pos.x = Math.max(-PLAY_BOUNDS + radius, Math.min(PLAY_BOUNDS - radius, pos.x));
        pos.z = Math.max(-PLAY_BOUNDS + radius, Math.min(PLAY_BOUNDS - radius, pos.z));
    }

    function resolveRobotRobotCollisions() {
        const minD = ROBOT_COLLISION_RADIUS * 2 + 0.14;

        for (let i = 0; i < robots.length; i++) {
            for (let j = i + 1; j < robots.length; j++) {
                const a = robots[i];
                const b = robots[j];
                const dx = a.position.x - b.position.x;
                const dz = a.position.z - b.position.z;
                const dist = Math.hypot(dx, dz);
                if (dist < minD) {
                    const nx = dist > 1e-6 ? dx / dist : 1;
                    const nz = dist > 1e-6 ? dz / dist : 0;
                    const push = (minD - dist) * 0.5;
                    a.position.x += nx * push;
                    a.position.z += nz * push;
                    b.position.x -= nx * push;
                    b.position.z -= nz * push;
                }
            }
        }

        for (const robot of robots) {
            const ud = robot.userData || {};
            robot.position.x = Math.max(-PLAY_BOUNDS + ROBOT_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - ROBOT_COLLISION_RADIUS, robot.position.x));
            robot.position.z = Math.max(-PLAY_BOUNDS + ROBOT_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - ROBOT_COLLISION_RADIUS, robot.position.z));
            resolveTreeCollisions(robot.position, ROBOT_COLLISION_RADIUS);

            if (isInWater(robot.position.x, robot.position.z) !== -1) {
                if (typeof ud.prevX === 'number' && typeof ud.prevZ === 'number') {
                    robot.position.x = ud.prevX;
                    robot.position.z = ud.prevZ;
                }

                if (isInWater(robot.position.x, robot.position.z) !== -1) {
                    let moved = false;
                    for (let dist = blockSize; dist <= 18 && !moved; dist += blockSize) {
                        for (let k = 0; k < 16; k++) {
                            const ang = (k / 16) * Math.PI * 2;
                            const x = Math.max(-PLAY_BOUNDS + ROBOT_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - ROBOT_COLLISION_RADIUS, robot.position.x + Math.cos(ang) * dist));
                            const z = Math.max(-PLAY_BOUNDS + ROBOT_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - ROBOT_COLLISION_RADIUS, robot.position.z + Math.sin(ang) * dist));
                            if (isInWater(x, z) === -1) {
                                robot.position.x = x;
                                robot.position.z = z;
                                moved = true;
                                break;
                            }
                        }
                    }
                }
            }
        }
    }

    // ══════════════════════════════════════════
    //  MAIN GAME LOOP
    // ══════════════════════════════════════════
    function animate() {
        requestAnimationFrame(animate);

        // Animation delta (used only for limb smoothing; gameplay physics remain frame-based)
        const now = performance.now();
        const last = animate.__lastT || now;
        const dt = Math.min(0.05, (now - last) / 1000);
        animate.__lastT = now;
        const dt60 = dt * 60;

        // Don't run game logic until difficulty is chosen
        if (!gameStarted) {
            renderer.render(scene, camera);
            return;
        }

        // Freeze game logic when finished
        if (gameEnded) {
            renderer.render(scene, camera);
            updateConfetti();
            return;
        }

        // ── Player movement ──
        const moveDir = new THREE.Vector3();
        let turnDirection = 0;

        if (keys['w']) moveDir.z -= 1;
        if (keys['s']) moveDir.z += 1;
        if (keys['a']) moveDir.x -= 1;
        if (keys['d']) moveDir.x += 1;

        if (keys['arrowup']) {
            moveDir.x += Math.sin(player.rotation.y);
            moveDir.z += Math.cos(player.rotation.y);
        }
        if (keys['arrowdown']) {
            moveDir.x -= Math.sin(player.rotation.y);
            moveDir.z -= Math.cos(player.rotation.y);
        }
        if (keys['arrowleft']) turnDirection = 1;
        if (keys['arrowright']) turnDirection = -1;

        // ── Mario jump ──
        if (isGrounded) coyoteTimer = COYOTE_TIME;
        else coyoteTimer = Math.max(0, coyoteTimer - 1);

        if (keys[' '] && coyoteTimer > 0 && playerVelocityY <= 0) {
            playerVelocityY = JUMP_VELOCITY;
            isGrounded = false;
            coyoteTimer = 0;
        }

        // Variable jump height: cut velocity when space released (Mario feel)
        if (!jumpHeld && playerVelocityY > 0.1) {
            playerVelocityY *= 0.65;
        }

        if (turnDirection !== 0) player.rotation.y += turnDirection * 0.05 * GLOBAL_SPEED_MULT;

        if (moveDir.length() > 0) {
            const moveUnit = moveDir.clone().normalize();
            let moveSpeed = gamePlayerSpeed;

            // Water rule: 5x slower only while grounded (jumping keeps normal horizontal speed).
            if (isGrounded) {
                const probeX = player.position.x + moveUnit.x * gamePlayerSpeed;
                const probeZ = player.position.z + moveUnit.z * gamePlayerSpeed;
                const inWaterNow = isInWater(player.position.x, player.position.z) !== -1;
                const inWaterAhead = isInWater(probeX, probeZ) !== -1;
                if (inWaterNow || inWaterAhead) moveSpeed *= WATER_WALK_SPEED_MULT;
            }

            moveDir.copy(moveUnit.multiplyScalar(moveSpeed));

            const newX = player.position.x + moveDir.x;
            const newZ = player.position.z + moveDir.z;

            // ── Terrain step check (prevent walking up) ──
            const currentTopY = getTerrainTopY(player.position.x, player.position.z);
            const nextTopY = getTerrainTopY(newX, newZ);
            const heightDiff = nextTopY - currentTopY;

            let canMove = true;

            // Block horizontal movement if terrain is too high AND player is grounded
            if (heightDiff > MAX_STEP_HEIGHT && isGrounded) {
                canMove = false;
            }
            // Also block if in air but feet would clip into terrain
            if (!isGrounded && nextTopY + PLAYER_FOOT_OFFSET > player.position.y + 0.2) {
                canMove = false;
            }

            if (canMove) {
                player.position.x = newX;
                player.position.z = newZ;
            }

            player.position.x = Math.max(-PLAY_BOUNDS + PLAYER_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - PLAYER_COLLISION_RADIUS, player.position.x));
            player.position.z = Math.max(-PLAY_BOUNDS + PLAYER_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - PLAYER_COLLISION_RADIUS, player.position.z));
            resolveTreeCollisions(player.position, PLAYER_COLLISION_RADIUS);
            resolveAnimalCollisions(player.position, PLAYER_COLLISION_RADIUS);
            resolveTreeCollisions(player.position, PLAYER_COLLISION_RADIUS);

            if (keys['w'] || keys['s'] || keys['a'] || keys['d']) {
                player.rotation.y = Math.atan2(moveDir.x, moveDir.z);
            }
        }

        // Always resolve any slight overlaps with trees (prevents rare stuck/jitter cases)
        resolveTreeCollisions(player.position, PLAYER_COLLISION_RADIUS);
        resolveAnimalCollisions(player.position, PLAYER_COLLISION_RADIUS);
        resolveTreeCollisions(player.position, PLAYER_COLLISION_RADIUS);

        // ── Gravity (Mario-style: faster fall) ──
        const currentGravity = (playerVelocityY < 0 || !jumpHeld) ? FAST_FALL_GRAVITY : GRAVITY;
        playerVelocityY += currentGravity;
        player.position.y += playerVelocityY;

        const terrainTop = getTerrainTopY(player.position.x, player.position.z);
        const groundLevel = terrainTop + PLAYER_FOOT_OFFSET;

        if (player.position.y <= groundLevel) {
            player.position.y = groundLevel;
            playerVelocityY = 0;
            isGrounded = true;
        } else {
            isGrounded = false;
        }

        const inWaterNow = isInWater(player.position.x, player.position.z) !== -1;
        if (inWaterNow && !wasPlayerInWater && isGrounded) {
            playSplashSound();
            waterStepSfxCooldown = 10;
        }

        const wantsWalkSplash = inWaterNow && isGrounded && moveDir.lengthSq() > 1e-6;
        if (wantsWalkSplash) {
            waterStepSfxCooldown -= dt60;
            if (waterStepSfxCooldown <= 0) {
                playWaterStepSplashSound();
                waterStepSfxCooldown = 12;
            }
        } else if (!inWaterNow) {
            waterStepSfxCooldown = 0;
        }
        wasPlayerInWater = inWaterNow;


        // ── Walk animation (player legs) ──
        const pw = player.userData.walk;
        if (pw) {
            // Drive gait from intent (prevents jitter/flicker when movement is blocked by walls/trees)
            const wantsMove = (moveDir.lengthSq() > 1e-6);
            if (pw.gait === undefined) pw.gait = 0;

            const targetGait = (isGrounded && wantsMove) ? 1 : 0;
            pw.gait += (targetGait - pw.gait) * (0.18 * dt60);

            // Slower, smoother cadence; scales a bit with speed
            const cadence = 0.55 * (gamePlayerSpeed / BASE_PLAYER_SPEED);
            pw.phase += pw.gait * cadence * dt60;

            const swing = Math.sin(pw.phase) * 0.75 * pw.gait;
            const footSwing = Math.sin(pw.phase + Math.PI / 8) * 0.35 * pw.gait;

            // Smooth toward targets (no snap)
            const lerpAmt = Math.min(1, 0.45 * dt60);
            pw.leftLeg.rotation.x += (swing * 0.95 - pw.leftLeg.rotation.x) * lerpAmt;
            pw.rightLeg.rotation.x += (-swing * 0.95 - pw.rightLeg.rotation.x) * lerpAmt;
            pw.leftFoot.rotation.x += (footSwing - pw.leftFoot.rotation.x) * lerpAmt;
            pw.rightFoot.rotation.x += (-footSwing - pw.rightFoot.rotation.x) * lerpAmt;
        }


        // ── Camera ──
        const camDist = 12;
        const camH = 6;
        const camAngle = player.rotation.y;
        const tx = player.position.x - Math.sin(camAngle) * camDist;
        const ty = player.position.y + camH;
        const tz = player.position.z - Math.cos(camAngle) * camDist;
        const sm = 0.2 * GLOBAL_SPEED_MULT;
        cam.cx += (tx - cam.cx) * sm;
        cam.cy += (ty - cam.cy) * sm;
        cam.cz += (tz - cam.cz) * sm;
        cam.cy = Math.min(cam.cy, player.position.y + 10);
        camera.position.set(cam.cx, cam.cy, cam.cz);
        cam.lx += (player.position.x - cam.lx) * sm;
        cam.ly += (player.position.y + 1 - cam.ly) * sm;
        cam.lz += (player.position.z - cam.lz) * sm;
        camera.lookAt(cam.lx, cam.ly, cam.lz);

        // ── Balloons (hover above terrain) ──
        const time = Date.now() * 0.001 * GLOBAL_SPEED_MULT;
        for (let i = balloons.length - 1; i >= 0; i--) {
            const b = balloons[i];

            // Magnet pickup: if you're close, the balloon drifts into you (much easier to grab).
            const dxBase = player.position.x - b.userData.baseX;
            const dzBase = player.position.z - b.userData.baseZ;
            const horizDistBase = Math.sqrt(dxBase*dxBase + dzBase*dzBase);

            if (horizDistBase < BALLOON_MAGNET_RADIUS) {
                const pull = (1 - horizDistBase / BALLOON_MAGNET_RADIUS);
                const step = pull * BALLOON_MAGNET_STRENGTH * GLOBAL_SPEED_MULT;
                b.userData.baseX += dxBase * step;
                b.userData.baseZ += dzBase * step;
                b.userData.baseX = Math.max(-PLAY_BOUNDS + 1, Math.min(PLAY_BOUNDS - 1, b.userData.baseX));
                b.userData.baseZ = Math.max(-PLAY_BOUNDS + 1, Math.min(PLAY_BOUNDS - 1, b.userData.baseZ));
            }

            const bTopY = getTerrainTopY(b.userData.baseX, b.userData.baseZ);
            b.position.set(
                b.userData.baseX,
                bTopY + 2.5 + Math.sin(time * 2 + b.userData.floatOffset) * 0.3,
                b.userData.baseZ
            );
            b.rotation.y += 0.02 * GLOBAL_SPEED_MULT;

            const dx = player.position.x - b.position.x;
            const dz = player.position.z - b.position.z;
            const dy = player.position.y - b.position.y;
            const horizDist = Math.sqrt(dx*dx + dz*dz);

            if (horizDist < BALLOON_PICKUP_RADIUS && Math.abs(dy) < BALLOON_PICKUP_Y_TOL) {
                scene.remove(b);
                balloons.splice(i, 1);
                score++;
                updateHUD();
                playBalloonSound(score - 1);
                if (score >= totalBalloons) {
                    gameEnded = true;
                    startConfetti();
                    updateConfetti();
                    playWinFanfare();
                    showMessage('🎉 YOU WIN!', 'Happy Birthday Bray! Press R to play again!');
                }
            }
}

        // ── Animals ──
        updateAnimals(dt60);

        // ── Robot AI with jump physics ──
        robots.forEach(robot => {
            const ud = robot.userData;
            const distToPlayer = robot.position.distanceTo(player.position);
            ud.prevX = robot.position.x;
            ud.prevZ = robot.position.z;

            // Physics first
            updateRobotPhysics(robot);

            if (distToPlayer < ud.detectionRadius) ud.chasing = true;
            else if (distToPlayer > ud.detectionRadius + 5) ud.chasing = false;

            if (ud.chasing) {
                const dir = new THREE.Vector3(
                    player.position.x - robot.position.x, 0,
                    player.position.z - robot.position.z
                ).normalize();

                const speed = gameRobotSpeed;
                const newX = robot.position.x + dir.x * speed;
                const newZ = robot.position.z + dir.z * speed;

                // Try to jump if terrain ahead is higher
                tryRobotJump(robot, newX, newZ);

                // Check if can move (terrain + tree collision)
                const currentTop = getTerrainTopY(robot.position.x, robot.position.z);
                const nextTop = getTerrainTopY(newX, newZ);
                let canMove = true;

                // Block if too steep AND grounded
                if (nextTop - currentTop > MAX_STEP_HEIGHT && ud.isGrounded) canMove = false;
                if (!ud.isGrounded && nextTop + PLAYER_FOOT_OFFSET > robot.position.y + 0.2) canMove = false;

                // Robots are never allowed in water.
                if (canMove && isInWater(newX, newZ) !== -1) canMove = false;

                const wouldBeDist = Math.sqrt((newX-player.position.x)**2 + (newZ-player.position.z)**2);
                if (canMove && wouldBeDist > 2.5) {
                    robot.position.x = newX;
                    robot.position.z = newZ;
                }

                robot.rotation.y = Math.atan2(dir.x, dir.z);

                // Fire laser
                if (!ud.lastLaserTime || Date.now() - ud.lastLaserTime > gameLaserInterval) {
                    createLaser(robot);
                    ud.lastLaserTime = Date.now();
                }
            } else {
                // Wander
                ud.wanderTimer++;
                if (ud.wanderTimer > 120) {
                    ud.velocity.set((Math.random()-.5)*gameRobotWander, 0, (Math.random()-.5)*gameRobotWander);
                    ud.wanderTimer = 0;
                }

                const newX = robot.position.x + ud.velocity.x;
                const newZ = robot.position.z + ud.velocity.z;

                tryRobotJump(robot, newX, newZ);

                const currentTop = getTerrainTopY(robot.position.x, robot.position.z);
                const nextTop = getTerrainTopY(newX, newZ);
                let canMove = true;
                if (nextTop - currentTop > MAX_STEP_HEIGHT && ud.isGrounded) canMove = false;

                // Robots are never allowed in water.
                if (canMove && isInWater(newX, newZ) !== -1) canMove = false;

                if (canMove) {
                    robot.position.x = newX;
                    robot.position.z = newZ;
                }
            }

            robot.position.x = Math.max(-PLAY_BOUNDS + ROBOT_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - ROBOT_COLLISION_RADIUS, robot.position.x));
            robot.position.z = Math.max(-PLAY_BOUNDS + ROBOT_COLLISION_RADIUS, Math.min(PLAY_BOUNDS - ROBOT_COLLISION_RADIUS, robot.position.z));
            resolveTreeCollisions(robot.position, ROBOT_COLLISION_RADIUS);
            resolveAnimalCollisions(robot.position, ROBOT_COLLISION_RADIUS);
            resolveTreeCollisions(robot.position, ROBOT_COLLISION_RADIUS);
            if (isInWater(robot.position.x, robot.position.z) !== -1) {
                robot.position.x = ud.prevX;
                robot.position.z = ud.prevZ;
            }


            // ── Walk animation (robot legs) ──
            if (ud.leftLeg) {
                // Drive gait from intent rather than tiny per-frame movement (prevents flicker near obstacles)
                const wantsMove = ud.chasing || (ud.velocity && (Math.abs(ud.velocity.x) + Math.abs(ud.velocity.z) > 0.00005));
                if (ud.gait === undefined) ud.gait = 0;

                const targetGait = (ud.isGrounded && wantsMove) ? 1 : 0;
                ud.gait += (targetGait - ud.gait) * (0.18 * dt60);

                const cadence = 0.6 * (gameRobotSpeed / BASE_ROBOT_SPEED);
                ud.walkPhase += ud.gait * cadence * dt60;

                const swing = Math.sin(ud.walkPhase) * 0.75 * ud.gait;
                const footSwing = Math.sin(ud.walkPhase + Math.PI / 10) * 0.32 * ud.gait;

                const lerpAmt = Math.min(1, 0.45 * dt60);
                ud.leftLeg.rotation.x += (swing * 0.95 - ud.leftLeg.rotation.x) * lerpAmt;
                ud.rightLeg.rotation.x += (-swing * 0.95 - ud.rightLeg.rotation.x) * lerpAmt;
                ud.leftFoot.rotation.x += (footSwing - ud.leftFoot.rotation.x) * lerpAmt;
                ud.rightFoot.rotation.x += (-footSwing - ud.rightFoot.rotation.x) * lerpAmt;
            }

            // Contact damage
            const heightDiff = Math.abs(robot.position.y - player.position.y);
            if (!invincible && distToPlayer < 2.2 && heightDiff < 2.5) {
                hitPlayer('robot');
            }
        });

        resolveRobotRobotCollisions();

        // ── Robot voice taunts ──
        maybeRobotTaunt();

        // ── Lasers ──
        updateLasers();

        updateStaticCulling();
        renderer.render(scene, camera);
        updateConfetti();
    }

    // ══════════════════════════════════════════
    //  RESIZE
    // ══════════════════════════════════════════
    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        resizeConfettiCanvas();
        if (!confettiActive) confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    });

    updateHUD();
    animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Unicorn Catcher</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            border: none;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.5);
            transition: all 0.5s ease;
        }
        #gameContainer.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
            z-index: 9999;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #bossWarning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(239, 68, 68, 0.95);
            padding: 30px 60px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: none;
            z-index: 15;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            border: 4px solid #fbbf24;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.05); }
        }
        #difficultySelect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            color: white;
            z-index: 25;
            border: 3px solid #9333ea;
        }
        #difficultySelect h2 {
            margin-top: 0;
            color: #a78bfa;
            font-size: 48px;
            margin-bottom: 30px;
        }
        .difficultyBtn {
            background: linear-gradient(135deg, #9333ea 0%, #c084fc 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
            display: block;
            width: 300px;
        }
        .difficultyBtn:hover {
            transform: scale(1.05);
        }
        .difficultyBtn.easy {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        }
        .difficultyBtn.medium {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
        }
        .difficultyBtn.hard {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: none;
            z-index: 20;
            border: 2px solid #9333ea;
        }
        #gameOver h2 {
            margin-top: 0;
            color: #a78bfa;
            font-size: 36px;
        }
        #restartBtn {
            background: linear-gradient(135deg, #9333ea 0%, #c084fc 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        #restartBtn:hover {
            transform: scale(1.05);
        }
        .golden {
            color: #fbbf24;
        }
        #bossHealth {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            display: none;
        }
        #bossHealthBar {
            width: 300px;
            height: 30px;
            background: rgba(0,0,0,0.7);
            border: 3px solid #fbbf24;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }
        #bossHealthFill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444 0%, #f59e0b 50%, #fbbf24 100%);
            transition: width 0.3s;
            box-shadow: 0 0 20px #fbbf24;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Bray's Lives: <span id="lives">300</span></div>
            <div id="powerupStatus" style="margin-top: 10px; font-size: 16px;">
                <div style="color: #fbbf24;">🔫 Bullets: <span id="bulletCount">1</span></div>
                <div style="color: #a78bfa;">🚀 Ship Level: <span id="shipLevel">1</span></div>
                <div id="dashCount" style="display: none; color: #60a5fa;">⚡ Dashes: <span id="dashNum">0</span></div>
                <div style="color: #78716c;">📦 Boxes: <span id="boxCount">0</span>/10</div>
            </div>
        </div>
        <div id="bossHealth">
            <div>PLANET SLAYER</div>
            <div id="bossHealthBar">
                <div id="bossHealthFill" style="width: 100%"></div>
            </div>
        </div>
        <div id="bossWarning">⚠️ WATCH OUT BRAY ⚠️</div>
        <div id="difficultySelect">
            <h2>Select Difficulty</h2>
            <button class="difficultyBtn easy" onclick="startGame('easy')">Easy Mode</button>
            <button class="difficultyBtn medium" onclick="startGame('medium')">Medium Mode</button>
            <button class="difficultyBtn hard" onclick="startGame('hard')">Hard Mode 💀</button>
        </div>
        <div id="gameOver">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Bosses Defeated: <span id="finalBosses">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');

        // Game state
        let score = 0;
        let lives = 300;
        let gameRunning = false;
        let difficulty = null;
        let unicorns = [];
        let meteors = [];
        let stars = [];
        let particles = [];
        let bullets = [];
        let sunBeams = [];
        let canShoot = true;
        let bossActive = false;
        let boss = null;
        let yellowBlocks = [];
        let astronauts = [];
        let dashPowerups = [];
        let spaceshipUpgrades = [];
        let starWarsCharacters = [];
        let lightyearSpeedPowerups = [];
        let permanentBulletCount = 1;
        let dashesAvailable = 0;
        let lastDashTime = 0;
        let yellowBoxesDestroyed = 0;
        let spaceshipLevel = 0;
        let seekingEnemies = [];
        let homingMissiles = [];
        let backgroundShips = [];
        let milkyWayStars = [];
        let bossesDefeated = 0;
        let nextBossScore = 150;
        let laserBeamUpgrade = false;
        let laserBeamTimer = 0;
        let bossShootTimeouts = [];
        const SPEED_MULTIPLIER = 1.2;
        const bossSequence = ['yellow', 'blue', 'red', 'earth', 'jupiter', 'mars', 'moon'];
        const bossDefinitions = {
            yellow: { name: 'PLANET SLAYER', color: 'yellow' },
            blue: { name: 'BLUE PLANET SLAYER', color: 'blue' },
            red: { name: 'RED PLANET SLAYER DESTROYER', color: 'red' },
            earth: { name: 'EARTH', planetType: 'earth' },
            jupiter: { name: 'JUPITER', planetType: 'jupiter' },
            mars: { name: 'MARS', planetType: 'mars' },
            moon: { name: 'THE MOON', planetType: 'moon' }
        };
        let forcedBossType = null;
        let bossSpawnPending = false;
        let bossSpawnTimer = null;

        // Resize canvas to window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            createMilkyWay();
            createBackgroundShips();
        }

        // Initialize canvas size
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Player
        const player = {
            x: 0,
            y: 0,
            width: 50,
            height: 50,
            speed: 8 * SPEED_MULTIPLIER,
            dx: 0,
            baseSpeed: 8 * SPEED_MULTIPLIER
        };

        // Initialize player position after canvas is sized
        player.x = canvas.width / 2;
        player.y = canvas.height - 80;

        // Start game with difficulty
        function startGame(selectedDifficulty) {
            difficulty = selectedDifficulty;
            document.getElementById('difficultySelect').style.display = 'none';
            gameRunning = true;

            // Set lives and speed based on difficulty
            if (difficulty === 'easy') {
                lives = 500;
                player.baseSpeed = 10 * SPEED_MULTIPLIER;
            } else if (difficulty === 'medium') {
                lives = 300;
                player.baseSpeed = 8 * SPEED_MULTIPLIER;
            } else if (difficulty === 'hard') {
                lives = 150;
                player.baseSpeed = 7 * SPEED_MULTIPLIER;
            }
            player.speed = player.baseSpeed;
            document.getElementById('lives').textContent = lives;

            // Reset player position
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
        }

        // Boss object
        function createBoss() {
            // Determine boss type - planets after 6 bosses
            let bossHealth = 30;
            let bossSpeed = 2;
            let shootInterval = 80;

            // Difficulty modifiers
            if (difficulty === 'easy') {
                bossHealth = 20;
                bossSpeed = 1.5;
                shootInterval = 120;
            } else if (difficulty === 'hard') {
                bossHealth = 80;
                bossSpeed = 4;
                shootInterval = 25;
            }

            // Progressive difficulty - bosses get MUCH harder over time
            const progressScale = Math.floor(bossesDefeated / 3);
            bossHealth += progressScale * 15;
            bossSpeed += bossesDefeated * 0.15;

            if (difficulty === 'hard') {
                // Hard mode gets exponentially harder
                bossHealth += progressScale * 25;
                bossSpeed += bossesDefeated * 0.25;
                shootInterval = Math.max(15, shootInterval - bossesDefeated * 3);
            } else {
                shootInterval = Math.max(30, shootInterval - bossesDefeated * 2);
            }

            bossSpeed *= SPEED_MULTIPLIER;
            shootInterval = Math.max(10, shootInterval / SPEED_MULTIPLIER);

            return {
                x: canvas.width / 2 - 100,
                y: 100,
                width: 200,
                height: 200,
                health: bossHealth,
                maxHealth: bossHealth,
                speed: bossSpeed,
                direction: 1,
                shootTimer: 0,
                shootInterval: shootInterval,
                angle: 0,
                isBlue: false,
                isRed: false,
                bossType: 'yellow',
                planetType: null
            };
        }

        // Controls
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Corner click detection to weaken enemies
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cornerSize = 100;

            // Check if click is in any corner
            const isCorner = (x < cornerSize && y < cornerSize) || // Top-left
                           (x > canvas.width - cornerSize && y < cornerSize) || // Top-right
                           (x < cornerSize && y > canvas.height - cornerSize) || // Bottom-left
                           (x > canvas.width - cornerSize && y > canvas.height - cornerSize); // Bottom-right

            if (isCorner && gameRunning) {
                weakenEnemies();
            }
        });

        // Dash with Shift key
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'Shift') && dashesAvailable > 0 && gameRunning) {
                const currentTime = Date.now();
                if (currentTime - lastDashTime > 500 / SPEED_MULTIPLIER) { // Cooldown
                    executeDash();
                    lastDashTime = currentTime;
                }
            }
        });

        // Create stars background
        function createStars(forceBoss = false) {
            stars = [];
            const numStars = (forceBoss || bossActive) ? 200 : 100;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: (Math.random() * 0.5 + 0.2) * SPEED_MULTIPLIER
                });
            }
        }
        createStars();

        // Create Milky Way background
        function createMilkyWay() {
            milkyWayStars = [];
            const numStars = 500;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 3;

            for (let i = 0; i < numStars; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * canvas.width * 0.9;
                const spiral = distance * 0.005;

                // Create spiral arms
                const armAngle = angle + spiral;
                const armWidth = 0.2;
                const inArm = Math.sin((angle - spiral) * 2) > 0.3;

                milkyWayStars.push({
                    x: centerX + Math.cos(armAngle) * distance,
                    y: centerY + Math.sin(armAngle) * distance * 0.25,
                    size: (Math.random() * 2 + 0.3) * (inArm ? 1.5 : 1),
                    opacity: (Math.random() * 0.6 + 0.2) * (inArm ? 1.3 : 0.7),
                    color: (() => {
                        const rand = Math.random();
                        if (rand > 0.7) return '#fef3c7'; // Yellow
                        if (rand > 0.4) return '#e0e7ff'; // Blue
                        if (rand > 0.2) return '#f3e8ff'; // Purple
                        return '#fce7f3'; // Pink
                    })(),
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }
        createMilkyWay();

        // Create background ships
        function createBackgroundShips() {
            backgroundShips = [];
            const numShips = 6;
            for (let i = 0; i < numShips; i++) {
                const depth = Math.random() * 0.6 + 0.4;
                backgroundShips.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height / 2,
                    width: (120 + Math.random() * 140) * depth,
                    height: (70 + Math.random() * 90) * (0.8 + depth * 0.3),
                    speed: (Math.random() * 0.35 + 0.25) * (0.6 + depth) * SPEED_MULTIPLIER,
                    opacity: 0.25 + depth * 0.35,
                    type: Math.floor(Math.random() * 5),
                    enginePulse: Math.random() * Math.PI * 2,
                    drift: Math.random() * 0.08 - 0.04,
                    depth: depth,
                    tilt: (Math.random() - 0.5) * 0.12,
                    hullWear: Math.random() * 0.2
                });
            }
        }
        createBackgroundShips();

        // Trigger boss
        function queueNextBoss(delay = 600 / SPEED_MULTIPLIER) {
            if (bossSpawnPending) return;
            bossSpawnPending = true;
            if (bossSpawnTimer) clearTimeout(bossSpawnTimer);
            bossSpawnTimer = setTimeout(() => {
                bossSpawnPending = false;
                bossSpawnTimer = null;
                triggerBoss();
            }, delay);
        }

        function triggerBoss() {
            bossSpawnPending = false;
            if (bossSpawnTimer) {
                clearTimeout(bossSpawnTimer);
                bossSpawnTimer = null;
            }
            bossActive = false;

            let bossType = forcedBossType || bossSequence[bossesDefeated % bossSequence.length];
            forcedBossType = null;
            const bossInfo = bossDefinitions[bossType] || bossDefinitions.yellow;
            const bossName = bossInfo.name || 'PLANET SLAYER';
            const planetType = bossInfo.planetType || null;
            const bossColor = bossInfo.color || 'yellow';

            // Show warning
            document.getElementById('bossWarning').style.display = 'block';
            document.getElementById('bossWarning').textContent = `⚠️ ${bossName} ⚠️`;
            setTimeout(() => {
                document.getElementById('bossWarning').style.display = 'none';
            }, 2000);

            // Go fullscreen
            gameContainer.classList.add('fullscreen');
            resizeCanvas();
            createStars(true);

            // Clear existing enemies
            unicorns = [];
            meteors = [];
            sunBeams = [];
            homingMissiles = [];

            // Create boss
            const newBoss = createBoss();
            newBoss.x = canvas.width / 2 - 100;
            newBoss.bossType = bossColor;
            newBoss.planetType = planetType;
            newBoss.isBlue = bossColor === 'blue';
            newBoss.isRed = bossColor === 'red';
            boss = newBoss;
            bossActive = true;

            // Reposition player
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 100;

            // Show boss health
            document.getElementById('bossHealth').style.display = 'block';
            document.getElementById('bossHealth').querySelector('div').textContent = bossName;
            document.getElementById('bossHealthFill').style.width = '100%';
        }

        // Weaken enemies (corner click)
        function weakenEnemies() {
            createParticles(canvas.width / 2, canvas.height / 2, '#a78bfa', 30);

            if (boss) {
                boss.health -= 5;
                const healthPercent = Math.max(0, (boss.health / boss.maxHealth) * 100);
                document.getElementById('bossHealthFill').style.width = healthPercent + '%';

                if (boss.health <= 0) {
                    defeatBoss();
                }
            } else {
                // Weaken regular enemies
                meteors.forEach(meteor => {
                    meteor.health = Math.max(0, meteor.health - 1);
                });
                yellowBlocks.forEach(block => {
                    block.health = Math.max(0, block.health - 1);
                });
            }
        }

        // Execute dash
        function executeDash() {
            dashesAvailable--;
            document.getElementById('dashNum').textContent = dashesAvailable;
            if (dashesAvailable <= 0) {
                document.getElementById('dashCount').style.display = 'none';
            }

            // Quick movement in current direction
            const dashDistance = 150 * SPEED_MULTIPLIER;
            if (keys['ArrowLeft'] || keys['a']) {
                player.x -= dashDistance;
            } else if (keys['ArrowRight'] || keys['d']) {
                player.x += dashDistance;
            }

            // Keep in bounds
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            // Visual effect
            createParticles(player.x + player.width / 2, player.y + player.height / 2, '#60a5fa', 20);
        }

        // Defeat boss
        function defeatBoss() {
            if (!boss) return; // Safety check

            const defeatedWasBlue = boss.isBlue;
            const defeatedWasYellow = !boss.isBlue && !boss.isRed && !boss.planetType;

            // No points for boss, just increment counter
            bossesDefeated++;
            document.getElementById('finalBosses').textContent = bossesDefeated;

            let particleColor = '#fbbf24';
            if (boss.planetType === 'earth') particleColor = '#3b82f6';
            else if (boss.planetType === 'jupiter') particleColor = '#f59e0b';
            else if (boss.planetType === 'mars') particleColor = '#dc2626';
            else if (boss.planetType === 'moon') particleColor = '#d1d5db';
            else if (boss.isRed) particleColor = '#ef4444';
            else if (boss.isBlue) particleColor = '#60a5fa';

            createParticles(boss.x + boss.width / 2, boss.y + boss.height / 2, particleColor, 150);

            // Clear any pending boss shoot timeouts
            bossShootTimeouts.forEach(timeout => clearTimeout(timeout));
            bossShootTimeouts = [];

            if (defeatedWasBlue) {
                forcedBossType = 'red';
            } else if (defeatedWasYellow) {
                forcedBossType = 'blue';
            }
            sunBeams = [];
            homingMissiles = [];
            bossActive = false;
            boss = null;
            document.getElementById('bossHealth').style.display = 'none';

            // Immediately trigger next boss without leaving fullscreen
            queueNextBoss(800 / SPEED_MULTIPLIER);
        }

        // Shoot bullet
        function shootBullet() {
            const spacing = 15;
            const startOffset = -(permanentBulletCount - 1) * spacing / 2;

            // Shoot regular bullets (faster and longer if laser beam upgrade)
            const bulletSpeed = (laserBeamUpgrade ? 15 : 10) * SPEED_MULTIPLIER;
            const bulletHeight = laserBeamUpgrade ? 25 : 15;

            for (let i = 0; i < permanentBulletCount; i++) {
                bullets.push({
                    x: player.x + player.width / 2 - 2 + startOffset + (i * spacing),
                    y: player.y,
                    width: 4,
                    height: bulletHeight,
                    speed: bulletSpeed
                });
            }

            // Shoot homing missiles if we have more than 5 bullets (limit to prevent lag)
            if (permanentBulletCount > 5 && homingMissiles.length < 20) {
                const homingCount = Math.min(permanentBulletCount - 5, 2);
                for (let i = 0; i < homingCount; i++) {
                    homingMissiles.push({
                        x: player.x + player.width / 2 - 3,
                        y: player.y,
                        width: 6,
                        height: 12,
                        speed: 8 * SPEED_MULTIPLIER,
                        vx: 0,
                        vy: -8 * SPEED_MULTIPLIER
                    });
                }
            }
        }

        // Boss shoots sun beam (or planet projectile)
        function shootSunBeam() {
            if (!boss) return;

            // Calculate angle to player
            const dx = player.x + player.width / 2 - (boss.x + boss.width / 2);
            const dy = player.y + player.height / 2 - (boss.y + boss.height / 2);
            const angle = Math.atan2(dy, dx);

            let beamSpeed = 6;
            if (difficulty === 'hard') {
                beamSpeed = 9;
            } else if (difficulty === 'easy') {
                beamSpeed = 4;
            }
            beamSpeed *= SPEED_MULTIPLIER;

            // Determine projectile type based on planet
            let projectileType = 'beam';
            if (boss.planetType === 'earth') projectileType = 'water';
            else if (boss.planetType === 'mars') projectileType = 'rock';
            else if (boss.planetType === 'jupiter') projectileType = 'gas';
            else if (boss.planetType === 'moon') projectileType = 'flag';

            sunBeams.push({
                x: boss.x + boss.width / 2,
                y: boss.y + boss.height / 2,
                width: 15,
                height: 15,
                speed: beamSpeed,
                angle: angle,
                vx: Math.cos(angle) * beamSpeed,
                vy: Math.sin(angle) * beamSpeed,
                life: 1,
                isBlue: boss.isBlue || false,
                isRed: boss.isRed || false,
                planetType: boss.planetType || null,
                projectileType: projectileType,
                damage: 1 + bossesDefeated, // Damage increases with each boss defeated
                rotation: 0
            });
        }

        // Spawn unicorn
        function spawnUnicorn() {
            const isGolden = Math.random() < 0.15;
            unicorns.push({
                x: Math.random() * (canvas.width - 40),
                y: -50,
                width: 40,
                height: 40,
                speed: (Math.random() * 2 + 2) * SPEED_MULTIPLIER,
                wobble: Math.random() * Math.PI * 2,
                golden: isGolden
            });
        }

        // Spawn meteor
        function spawnMeteor() {
            const isBig = Math.random() < 0.2;
            let baseSpeed = (isBig ? Math.random() * 1.5 + 1.5 : Math.random() * 3 + 2) * SPEED_MULTIPLIER;

            // Difficulty modifiers
            if (difficulty === 'easy') {
                baseSpeed *= 0.7;
            } else if (difficulty === 'hard') {
                baseSpeed *= 1.8;
            }

            meteors.push({
                x: Math.random() * canvas.width,
                y: -50,
                width: isBig ? 80 : 50,
                height: isBig ? 80 : 50,
                speed: baseSpeed,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.1,
                big: isBig,
                health: isBig ? 3 : 1
            });
        }

        function spawnYellowBlock() {

        // Spawn seeking enemy (follows player)
        function spawnSeekingEnemy() {
            const scaryLevel = Math.min(permanentBulletCount, 10);
            let baseSpeed = 2.5 + scaryLevel * 0.2;
            let baseHealth = 2 + Math.floor(scaryLevel / 2);

            // Difficulty modifiers
            if (difficulty === 'easy') {
                baseSpeed *= 0.7;
            } else if (difficulty === 'hard') {
                baseSpeed *= 2;
                baseHealth += 2;
            }

            seekingEnemies.push({
                x: Math.random() * canvas.width,
                y: -50,
                width: 45 + scaryLevel * 2,
                height: 45 + scaryLevel * 2,
                speed: baseSpeed * SPEED_MULTIPLIER,
                health: baseHealth
            });
        }

        // Create particle effect
        function createParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1
                });
            }
        }

        // Explode big meteor into smaller ones
        function explodeMeteor(meteor) {
            createParticles(meteor.x + meteor.width / 2, meteor.y + meteor.height / 2, '#f97316', 25);

            const numFragments = Math.floor(Math.random() * 2) + 3;
            for (let i = 0; i < numFragments; i++) {
                meteors.push({
                    x: meteor.x + meteor.width / 2 - 25,
                    y: meteor.y + meteor.height / 2 - 25,
                    width: 35,
                    height: 35,
                    speed: (Math.random() * 4 + 3) * SPEED_MULTIPLIER,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.15,
                    big: false,
                    health: 1,
                    vx: (Math.random() - 0.5) * 4 * SPEED_MULTIPLIER
                });
            }
        }

        // Draw player
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

            const scale = 1 + (spaceshipLevel * 0.2);
            ctx.scale(scale, scale);

            // Different colors based on level
            const shipColors = [
                '#e0e0e0',  // Level 1: Silver
                '#60a5fa',  // Level 2: Blue
                '#a78bfa',  // Level 3: Purple
                '#fbbf24',  // Level 4: Gold
                '#f59e0b',  // Level 5: Orange
                '#ef4444'   // Level 6: Red
            ];
            const color = shipColors[Math.min(spaceshipLevel, 5)];

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(10, 10);
            ctx.lineTo(-10, 10);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.fillStyle = spaceshipLevel >= 3 ? '#fbbf24' : '#60a5fa';
            ctx.beginPath();
            ctx.arc(0, -5, 5, 0, Math.PI * 2);
            ctx.fill();

            // Wings
            ctx.fillStyle = spaceshipLevel >= 2 ? '#fbbf24' : '#ef4444';
            ctx.beginPath();
            ctx.moveTo(-10, 10);
            ctx.lineTo(-15, 20);
            ctx.lineTo(-8, 15);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(10, 10);
            ctx.lineTo(15, 20);
            ctx.lineTo(8, 15);
            ctx.closePath();
            ctx.fill();

            // Extra wings for higher levels
            if (spaceshipLevel >= 4) {
                ctx.fillStyle = '#a78bfa';
                ctx.beginPath();
                ctx.moveTo(-12, 5);
                ctx.lineTo(-20, 15);
                ctx.lineTo(-12, 12);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(12, 5);
                ctx.lineTo(20, 15);
                ctx.lineTo(12, 12);
                ctx.closePath();
                ctx.fill();
            }

            // Flames
            const flameHeight = Math.random() * 5 + 10;
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.moveTo(-5, 15);
            ctx.lineTo(0, 15 + flameHeight);
            ctx.lineTo(5, 15);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(-3, 15);
            ctx.lineTo(0, 15 + flameHeight - 3);
            ctx.lineTo(3, 15);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Draw bullet
        function drawBullet(bullet) {
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

            ctx.fillStyle = '#93c5fd';
            ctx.fillRect(bullet.x + 1, bullet.y, bullet.width - 2, bullet.height);

            ctx.shadowBlur = 10;
            ctx.shadowColor = '#60a5fa';
            ctx.fillStyle = '#dbeafe';
            ctx.fillRect(bullet.x + 1.5, bullet.y, bullet.width - 3, bullet.height);
            ctx.shadowBlur = 0;
        }

        // Draw sun beam or planet projectile
        function drawSunBeam(beam) {
            ctx.save();
            ctx.translate(beam.x, beam.y);

            if (beam.projectileType === 'water') {
                // Water droplet
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#3b82f6';

                const waterGradient = ctx.createRadialGradient(0, -5, 0, 0, 0, beam.width);
                waterGradient.addColorStop(0, '#dbeafe');
                waterGradient.addColorStop(0.5, '#60a5fa');
                waterGradient.addColorStop(1, '#3b82f6');
                ctx.fillStyle = waterGradient;

                ctx.beginPath();
                ctx.arc(0, 0, beam.width * 0.6, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, -beam.width);
                ctx.quadraticCurveTo(-beam.width * 0.7, -beam.width * 0.3, 0, beam.width * 0.8);
                ctx.quadraticCurveTo(beam.width * 0.7, -beam.width * 0.3, 0, -beam.width);
                ctx.fill();

                // Shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(-beam.width * 0.3, -beam.width * 0.3, beam.width * 0.3, 0, Math.PI * 2);
                ctx.fill();

            } else if (beam.projectileType === 'rock') {
                // Rocky meteor
                ctx.rotate(beam.rotation);
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#78716c';

                ctx.fillStyle = '#78716c';
                ctx.beginPath();
                ctx.moveTo(beam.width, 0);
                ctx.lineTo(beam.width * 0.5, beam.width * 0.8);
                ctx.lineTo(-beam.width * 0.3, beam.width * 0.6);
                ctx.lineTo(-beam.width, 0);
                ctx.lineTo(-beam.width * 0.5, -beam.width * 0.7);
                ctx.lineTo(beam.width * 0.3, -beam.width * 0.9);
                ctx.closePath();
                ctx.fill();

                // Darker spots
                ctx.fillStyle = '#57534e';
                ctx.beginPath();
                ctx.arc(beam.width * 0.2, beam.width * 0.3, beam.width * 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-beam.width * 0.4, -beam.width * 0.2, beam.width * 0.25, 0, Math.PI * 2);
                ctx.fill();

            } else if (beam.projectileType === 'gas') {
                // Swirling gas cloud
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#f59e0b';

                const gasGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, beam.width * 1.5);
                gasGradient.addColorStop(0, 'rgba(253, 230, 138, 0.8)');
                gasGradient.addColorStop(0.5, 'rgba(245, 158, 11, 0.6)');
                gasGradient.addColorStop(1, 'rgba(217, 119, 6, 0.2)');
                ctx.fillStyle = gasGradient;

                for (let i = 0; i < 3; i++) {
                    const offset = Math.sin(Date.now() * 0.005 + i) * beam.width * 0.3;
                    ctx.beginPath();
                    ctx.arc(offset, 0, beam.width * (0.7 + i * 0.3), 0, Math.PI * 2);
                    ctx.fill();
                }

            } else if (beam.projectileType === 'flag') {
                // Moon flag
                ctx.rotate(beam.angle);
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#9ca3af';

                // Flag pole
                ctx.strokeStyle = '#6b7280';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, -beam.width);
                ctx.lineTo(0, beam.width);
                ctx.stroke();

                // Flag (white with wave)
                ctx.fillStyle = '#f3f4f6';
                ctx.beginPath();
                ctx.moveTo(0, -beam.width);
                const waveOffset = Math.sin(Date.now() * 0.01) * 3;
                ctx.quadraticCurveTo(beam.width * 0.7 + waveOffset, -beam.width * 0.7, beam.width * 1.2, -beam.width * 0.5);
                ctx.lineTo(beam.width * 1.2 + waveOffset, -beam.width * 0.2);
                ctx.quadraticCurveTo(beam.width * 0.7, -beam.width * 0.3, 0, -beam.width * 0.5);
                ctx.closePath();
                ctx.fill();

                // Flag detail (star or symbol)
                ctx.fillStyle = '#9ca3af';
                ctx.beginPath();
                ctx.arc(beam.width * 0.6, -beam.width * 0.6, beam.width * 0.15, 0, Math.PI * 2);
                ctx.fill();

            } else {
                // Regular sun beam
                ctx.rotate(beam.angle);

                let outerColor = '#fbbf24';
                let innerColor = '#fef3c7';

                if (beam.isRed) {
                    outerColor = '#ef4444';
                    innerColor = '#fecaca';
                } else if (beam.isBlue) {
                    outerColor = '#60a5fa';
                    innerColor = '#dbeafe';
                }

                ctx.shadowBlur = 20;
                ctx.shadowColor = outerColor;
                ctx.fillStyle = outerColor;
                ctx.beginPath();
                ctx.arc(0, 0, beam.width, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = innerColor;
                ctx.beginPath();
                ctx.arc(0, 0, beam.width * 0.6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Draw boss (sun or planet)
        function drawBoss() {
            if (!boss) return;

            ctx.save();
            ctx.translate(boss.x + boss.width / 2, boss.y + boss.height / 2);

            // Gravitational field rings (visible indicator of gravity)
            let gravityColor = 'rgba(251, 191, 36, 0.1)';
            if (boss.planetType === 'earth') gravityColor = 'rgba(59, 130, 246, 0.1)';
            else if (boss.planetType === 'jupiter') gravityColor = 'rgba(245, 158, 11, 0.1)';
            else if (boss.planetType === 'mars') gravityColor = 'rgba(239, 68, 68, 0.1)';
            else if (boss.planetType === 'moon') gravityColor = 'rgba(156, 163, 175, 0.1)';
            else if (boss.isRed) gravityColor = 'rgba(239, 68, 68, 0.1)';
            else if (boss.isBlue) gravityColor = 'rgba(96, 165, 250, 0.1)';

            for (let i = 1; i <= 3; i++) {
                const ringSize = boss.width / 2 + i * 100 + Math.sin(Date.now() * 0.002 + i) * 20;
                ctx.strokeStyle = gravityColor;
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.3 - i * 0.08;
                ctx.beginPath();
                ctx.arc(0, 0, ringSize, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // Draw planet or sun
            if (boss.planetType) {
                drawPlanet(boss.planetType);
            } else {
                drawSun();
            }

            ctx.restore();
        }

        // Draw sun boss
        function drawSun() {
            ctx.rotate(boss.angle);

            // Outer glow
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, boss.width / 2);
            if (boss.isRed) {
                gradient.addColorStop(0, '#fecaca');
                gradient.addColorStop(0.4, '#ef4444');
                gradient.addColorStop(0.7, '#dc2626');
                gradient.addColorStop(1, '#7f1d1d');
                ctx.shadowColor = '#ef4444';
            } else if (boss.isBlue) {
                gradient.addColorStop(0, '#dbeafe');
                gradient.addColorStop(0.4, '#60a5fa');
                gradient.addColorStop(0.7, '#3b82f6');
                gradient.addColorStop(1, '#1d4ed8');
                ctx.shadowColor = '#60a5fa';
            } else {
                gradient.addColorStop(0, '#fef3c7');
                gradient.addColorStop(0.4, '#fbbf24');
                gradient.addColorStop(0.7, '#f59e0b');
                gradient.addColorStop(1, '#ef4444');
                ctx.shadowColor = '#fbbf24';
            }

            ctx.shadowBlur = 40;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, boss.width / 2, 0, Math.PI * 2);
            ctx.fill();

            // Sun rays
            ctx.fillStyle = boss.isRed ? '#ef4444' : (boss.isBlue ? '#60a5fa' : '#fbbf24');
            const numRays = boss.isRed ? 16 : 12;
            for (let i = 0; i < numRays; i++) {
                const angle = (Math.PI * 2 / numRays) * i;
                const length = boss.width / 2 + 20 + Math.sin(Date.now() * 0.003 + i) * 10;
                ctx.save();
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(boss.width / 2, 0);
                ctx.lineTo(length, -8);
                ctx.lineTo(length, 8);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            // Face
            ctx.fillStyle = boss.isRed ? '#450a0a' : (boss.isBlue ? '#1e3a8a' : '#7c2d12');
            // Angry eyes
            ctx.beginPath();
            ctx.arc(-30, -20, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(30, -20, 12, 0, Math.PI * 2);
            ctx.fill();

            // Extra angry eye for red boss
            if (boss.isRed) {
                ctx.beginPath();
                ctx.arc(0, -30, 10, 0, Math.PI * 2);
                ctx.fill();
            }

            // Angry eyebrows
            ctx.strokeStyle = boss.isRed ? '#450a0a' : (boss.isBlue ? '#1e3a8a' : '#7c2d12');
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-45, -35);
            ctx.lineTo(-15, -25);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(45, -35);
            ctx.lineTo(15, -25);
            ctx.stroke();

            // Angry mouth
            ctx.beginPath();
            ctx.arc(0, 20, 40, 0, Math.PI);
            ctx.stroke();

            ctx.shadowBlur = 0;
        }

        // Draw planet bosses
        function drawPlanet(planetType) {
            ctx.rotate(boss.angle * 0.2);

            if (planetType === 'earth') {
                // Earth
                const earthGradient = ctx.createRadialGradient(-20, -20, 0, 0, 0, boss.width / 2);
                earthGradient.addColorStop(0, '#60a5fa');
                earthGradient.addColorStop(0.4, '#3b82f6');
                earthGradient.addColorStop(0.7, '#2563eb');
                earthGradient.addColorStop(1, '#1e40af');
                ctx.fillStyle = earthGradient;
                ctx.beginPath();
                ctx.arc(0, 0, boss.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // Continents (green land masses)
                ctx.fillStyle = '#10b981';
                ctx.beginPath();
                ctx.arc(-40, -30, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(30, 20, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-20, 50, 30, 0, Math.PI * 2);
                ctx.fill();

                // Clouds (white swirls)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(20, -40, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-50, 10, 20, 0, Math.PI * 2);
                ctx.fill();

            } else if (planetType === 'jupiter') {
                // Jupiter
                const jupiterGradient = ctx.createRadialGradient(-30, -30, 0, 0, 0, boss.width / 2);
                jupiterGradient.addColorStop(0, '#fde68a');
                jupiterGradient.addColorStop(0.3, '#fbbf24');
                jupiterGradient.addColorStop(0.6, '#f59e0b');
                jupiterGradient.addColorStop(1, '#d97706');
                ctx.fillStyle = jupiterGradient;
                ctx.beginPath();
                ctx.arc(0, 0, boss.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // Gas bands
                ctx.strokeStyle = 'rgba(180, 83, 9, 0.4)';
                ctx.lineWidth = 15;
                for (let i = -3; i <= 3; i++) {
                    ctx.beginPath();
                    ctx.arc(0, 0, boss.width / 2 - 10, -0.3 + i * 0.3, 0.3 + i * 0.3);
                    ctx.stroke();
                }

                // Great Red Spot
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.ellipse(40, 20, 35, 25, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.ellipse(40, 20, 25, 18, 0.3, 0, Math.PI * 2);
                ctx.fill();

            } else if (planetType === 'mars') {
                // Mars
                const marsGradient = ctx.createRadialGradient(-25, -25, 0, 0, 0, boss.width / 2);
                marsGradient.addColorStop(0, '#fca5a5');
                marsGradient.addColorStop(0.4, '#ef4444');
                marsGradient.addColorStop(0.7, '#dc2626');
                marsGradient.addColorStop(1, '#991b1b');
                ctx.fillStyle = marsGradient;
                ctx.beginPath();
                ctx.arc(0, 0, boss.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // Darker regions
                ctx.fillStyle = 'rgba(127, 29, 29, 0.5)';
                ctx.beginPath();
                ctx.arc(-30, 30, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(40, -20, 35, 0, Math.PI * 2);
                ctx.fill();

                // Polar ice cap
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(0, -80, 25, 0, Math.PI * 2);
                ctx.fill();

                // Impact craters
                ctx.strokeStyle = '#7f1d1d';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(20, 10, 15, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(-40, -10, 12, 0, Math.PI * 2);
                ctx.stroke();

            } else if (planetType === 'moon') {
                // Moon
                const moonGradient = ctx.createRadialGradient(-30, -30, 0, 0, 0, boss.width / 2);
                moonGradient.addColorStop(0, '#f3f4f6');
                moonGradient.addColorStop(0.5, '#d1d5db');
                moonGradient.addColorStop(1, '#9ca3af');
                ctx.fillStyle = moonGradient;
                ctx.beginPath();
                ctx.arc(0, 0, boss.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // Craters (many more than mars)
                ctx.fillStyle = '#9ca3af';
                ctx.strokeStyle = '#6b7280';
                ctx.lineWidth = 2;
                const craters = [
                    {x: -40, y: -30, r: 25},
                    {x: 30, y: 20, r: 30},
                    {x: -20, y: 40, r: 20},
                    {x: 50, y: -40, r: 18},
                    {x: 0, y: -50, r: 15},
                    {x: -60, y: 10, r: 22},
                    {x: 15, y: 50, r: 16}
                ];
                craters.forEach(crater => {
                    ctx.beginPath();
                    ctx.arc(crater.x, crater.y, crater.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    // Crater shadow
                    ctx.fillStyle = '#6b7280';
                    ctx.beginPath();
                    ctx.arc(crater.x - crater.r * 0.3, crater.y - crater.r * 0.3, crater.r * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#9ca3af';
                });
            }

            // All planets get angry face
            ctx.fillStyle = '#1f2937';
            ctx.beginPath();
            ctx.arc(-30, -20, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(30, -20, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-45, -35);
            ctx.lineTo(-15, -25);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(45, -35);
            ctx.lineTo(15, -25);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 20, 40, 0, Math.PI);
            ctx.stroke();
        }

        // Draw yellow block
        function drawYellowBlock(block) {
            ctx.save();
            ctx.translate(block.x + block.width / 2, block.y + block.height / 2);

            const pulseSize = Math.sin(block.pulse) * 3;

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fbbf24';
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(-block.width / 2 - pulseSize, -block.height / 2 - pulseSize,
                        block.width + pulseSize * 2, block.height + pulseSize * 2);

            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(-block.width / 2 + 5, -block.height / 2 + 5,
                        block.width - 10, block.height - 10);

            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', 0, 0);

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Draw astronaut
        function drawAstronaut(astronaut) {
            ctx.save();
            ctx.translate(astronaut.x + astronaut.width / 2, astronaut.y + astronaut.height / 2);

            // Helmet
            ctx.fillStyle = '#e0e0e0';
            ctx.beginPath();
            ctx.arc(0, -5, 15, 0, Math.PI * 2);
            ctx.fill();

            // Visor
            ctx.fillStyle = '#60a5fa';
            ctx.beginPath();
            ctx.arc(0, -5, 10, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(-10, 5, 20, 20);

            // Arms
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 5;

        // Draw seeking enemy
        function drawSeekingEnemy(enemy) {
            ctx.save();
            ctx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);

            // Scarier colors based on player bullet count
            const scaryLevel = Math.min(permanentBulletCount, 10);
            const colors = [
                '#dc2626', '#b91c1c', '#991b1b', '#7f1d1d', '#450a0a',
                '#7c2d12', '#78350f', '#713f12', '#292524', '#0c0a09'
            ];
            const bodyColor = colors[Math.min(scaryLevel - 1, colors.length - 1)];

            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.arc(0, 0, enemy.width / 2, 0, Math.PI * 2);
            ctx.fill();

            // More bumps as it gets scarier
            if (scaryLevel > 3) {
                ctx.fillStyle = '#fca5a5';
                ctx.beginPath();
                ctx.arc(-8, -8, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(8, -8, 8, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#fca5a5';
                ctx.beginPath();
                ctx.arc(-8, -8, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            // Evil eyes - more eyes as it gets scarier
            ctx.fillStyle = scaryLevel > 5 ? '#fbbf24' : '#7f1d1d';
            ctx.beginPath();
            ctx.arc(-8, -5, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(8, -5, 4, 0, Math.PI * 2);
            ctx.fill();

            if (scaryLevel > 7) {
                ctx.beginPath();
                ctx.arc(0, 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // More spikes as it gets scarier
            const numSpikes = 8 + Math.floor(scaryLevel / 2);
            ctx.strokeStyle = scaryLevel > 6 ? '#450a0a' : '#991b1b';
            ctx.lineWidth = scaryLevel > 4 ? 4 : 3;
            for (let i = 0; i < numSpikes; i++) {
                const angle = (Math.PI * 2 / numSpikes) * i;
                const spikeLength = 10 + scaryLevel;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * (enemy.width / 2), Math.sin(angle) * (enemy.width / 2));
                ctx.lineTo(Math.cos(angle) * (enemy.width / 2 + spikeLength), Math.sin(angle) * (enemy.width / 2 + spikeLength));
                ctx.stroke();
            }

            // Add glowing aura for really scary enemies
            if (scaryLevel > 8) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ef4444';
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, enemy.width / 2 + 5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // Draw homing missile
        function drawHomingMissile(missile) {
            ctx.save();
            ctx.translate(missile.x, missile.y);

            const angle = Math.atan2(missile.vy, missile.vx);
            ctx.rotate(angle + Math.PI / 2);

            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f59e0b';
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(0, -missile.height / 2);
            ctx.lineTo(missile.width / 2, missile.height / 2);
            ctx.lineTo(-missile.width / 2, missile.height / 2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.moveTo(0, -missile.height / 2 + 3);
            ctx.lineTo(missile.width / 2 - 2, missile.height / 2);
            ctx.lineTo(-missile.width / 2 + 2, missile.height / 2);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Draw Lightyear Speed powerup
        function drawLightyearSpeed(powerup) {
            ctx.save();
            ctx.translate(powerup.x + powerup.width / 2, powerup.y + powerup.height / 2);

            const pulseSize = Math.sin(powerup.pulse) * 5;

            // Outer glow rings
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#3b82f6';

            ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, powerup.width / 2 + pulseSize + 10, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(147, 197, 253, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, powerup.width / 2 + pulseSize + 20, 0, Math.PI * 2);
            ctx.stroke();

            ctx.rotate(powerup.rotation);

            // Main star shape
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 / 8) * i;
                const radius = i % 2 === 0 ? powerup.width / 2 : powerup.width / 4;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fill();

            // Inner bright core
            ctx.fillStyle = '#dbeafe';
            ctx.beginPath();
            ctx.arc(0, 0, powerup.width / 5, 0, Math.PI * 2);
            ctx.fill();

            // Speed lines
            ctx.strokeStyle = '#93c5fd';
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
                const angle = (Math.PI / 2) * i;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * 12, Math.sin(angle) * 12);
                ctx.lineTo(Math.cos(angle) * 22, Math.sin(angle) * 22);
                ctx.stroke();
            }

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Draw unicorn
        function drawUnicorn(unicorn) {

            ctx.ellipse(-8, -5, 10, 8, 0, 0, Math.PI * 2);

            ctx.fillStyle = unicorn.golden ? '#f59e0b' : '#fbbf24';
            ctx.beginPath();
            ctx.moveTo(-8, -13);
            ctx.lineTo(-5, -5);
            ctx.lineTo(-11, -5);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#1f2937';
            ctx.beginPath();
            ctx.arc(-10, -6, 2, 0, Math.PI * 2);

            ctx.strokeStyle = unicorn.golden ? '#fef3c7' : '#fce7f3';

                const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'];

                    ctx.arc(-3 + i * 2, -8 - i, 3, 0, Math.PI * 2);

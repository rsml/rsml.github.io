        // Draw meteor
        function drawMeteor(meteor) {
            ctx.save();
            ctx.translate(meteor.x + meteor.width / 2, meteor.y + meteor.height / 2);
            ctx.rotate(meteor.rotation);

            const radius = meteor.big ? 35 : 20;

            ctx.fillStyle = meteor.big ? '#991b1b' : '#78716c';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = meteor.big ? '#7f1d1d' : '#57534e';
            ctx.beginPath();
            ctx.arc(-radius * 0.25, -radius * 0.25, radius * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(radius * 0.35, radius * 0.15, radius * 0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-radius * 0.1, radius * 0.4, radius * 0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = meteor.big ? 'rgba(239, 68, 68, 0.6)' : 'rgba(251, 146, 60, 0.6)';
            ctx.beginPath();
            ctx.moveTo(radius * 0.75, 0);
            ctx.lineTo(radius * 1.5, -radius * 0.4);
            ctx.lineTo(radius * 1.5, radius * 0.4);
            ctx.closePath();
            ctx.fill();

            if (meteor.big) {
                const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
                ctx.strokeStyle = `rgba(239, 68, 68, ${pulse})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, radius + 5, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Update game
        function update() {
            if (!gameRunning) return;

            // Safety net: if a boss is expected but missing, queue it
            if ((bossActive || bossSpawnPending) && !boss) {
                queueNextBoss(200);
                return;
            }

            // Update laser beam timer
            if (laserBeamUpgrade) {
                laserBeamTimer--;
                if (laserBeamTimer <= 0) {
                    laserBeamUpgrade = false;
                }
            }

            // Update boss
            if (bossActive && boss) {
                boss.angle += 0.02;

                // Move boss around
                boss.x += boss.speed * boss.direction;
                boss.y += Math.sin(Date.now() * 0.002) * 2;

                // Bounce off edges
                if (boss.x <= 0 || boss.x >= canvas.width - boss.width) {
                    boss.direction *= -1;
                }

                // Keep in bounds vertically
                if (boss.y < 50) boss.y = 50;
                if (boss.y > canvas.height / 3) boss.y = canvas.height / 3;

                // Boss gravitational pull and collision
                const bossCenter = {
                    x: boss.x + boss.width / 2,
                    y: boss.y + boss.height / 2
                };
                const playerCenter = {
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2
                };
                const dx = bossCenter.x - playerCenter.x;
                const dy = bossCenter.y - playerCenter.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // Gravitational pull - felt across entire screen, stronger when close
                // Uses inverse square law for realistic gravity
                const maxGravityDistance = Math.max(canvas.width, canvas.height);
                if (distance < maxGravityDistance && distance > boss.width / 2 + player.width / 2) {
                    // Gravity formula: strength = mass / (distance^1.5)
                    // Using 1.5 instead of 2 to make it more noticeable at far distances
                    const gravityStrength = 5000 / Math.pow(distance, 1.5);
                    player.x += (dx / distance) * gravityStrength;
                    player.y += (dy / distance) * gravityStrength;

                    // Visual feedback - pull particles when being pulled
                    if (Math.random() < gravityStrength * 2) {
                        let pullColor = '#fbbf24';
                        if (boss.planetType === 'earth') pullColor = '#3b82f6';
                        else if (boss.planetType === 'jupiter') pullColor = '#f59e0b';
                        else if (boss.planetType === 'mars') pullColor = '#ef4444';
                        else if (boss.planetType === 'moon') pullColor = '#9ca3af';
                        else if (boss.isRed) pullColor = '#ef4444';
                        else if (boss.isBlue) pullColor = '#60a5fa';

                        particles.push({
                            x: playerCenter.x,
                            y: playerCenter.y,
                            vx: (dx / distance) * 2,
                            vy: (dy / distance) * 2,
                            size: 2,
                            color: pullColor,
                            life: 0.5
                        });
                    }
                }

                // Fling away on collision
                if (distance < boss.width / 2 + player.width / 2) {
                    lives -= 5;
                    document.getElementById('lives').textContent = lives;

                    // Fling player away
                    const flingStrength = 80;
                    player.x -= (dx / distance) * flingStrength;
                    player.y -= (dy / distance) * flingStrength;

                    createParticles(playerCenter.x, playerCenter.y, '#ef4444', 30);

                    if (lives <= 0) {
                        gameOver();
                    }
                }

                // Shoot sun beams
                boss.shootTimer++;
                const shootInterval = boss.isRed ? 40 : (boss.isBlue ? 50 : 80);
                if (boss.shootTimer >= shootInterval) {
                    shootSunBeam();
                    // Blue boss shoots 3 beams
                    if (boss.isBlue) {
                        bossShootTimeouts.push(setTimeout(() => { if (boss && bossActive) shootSunBeam(); }, 100));
                        bossShootTimeouts.push(setTimeout(() => { if (boss && bossActive) shootSunBeam(); }, 200));
                    }
                    // Red boss shoots 5 beams
                    if (boss.isRed) {
                        bossShootTimeouts.push(setTimeout(() => { if (boss && bossActive) shootSunBeam(); }, 80));
                        bossShootTimeouts.push(setTimeout(() => { if (boss && bossActive) shootSunBeam(); }, 160));
                        bossShootTimeouts.push(setTimeout(() => { if (boss && bossActive) shootSunBeam(); }, 240));
                        bossShootTimeouts.push(setTimeout(() => { if (boss && bossActive) shootSunBeam(); }, 320));
                    }
                    boss.shootTimer = 0;
                }
            }

            // Auto-fire when space is held
            if ((keys[' '] || keys['Spacebar']) && canShoot && gameRunning) {
                shootBullet();
                canShoot = false;
                setTimeout(() => canShoot = true, 250 / SPEED_MULTIPLIER);
            }

            // Move player
            let dx = 0;
            let dy = 0;

            const moveSpeed = player.baseSpeed || player.speed;
            if (keys['ArrowLeft'] || keys['a']) dx = -moveSpeed;
            else if (keys['ArrowRight'] || keys['d']) dx = moveSpeed;

            if (keys['ArrowUp'] || keys['w']) dy = -moveSpeed;
            else if (keys['ArrowDown'] || keys['s']) dy = moveSpeed;

            player.x += dx;
            player.y += dy;

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;

            // Update bullets
            bullets.forEach((bullet, index) => {
                bullet.y -= bullet.speed;

                if (bullet.y < -bullet.height) {
                    bullets.splice(index, 1);
                }
            });

            // Update sun beams
            sunBeams.forEach((beam, index) => {
                beam.x += beam.vx;
                beam.y += beam.vy;
                beam.life -= 0.003;

                // Rotate rocks
                if (beam.projectileType === 'rock') {
                    beam.rotation += 0.1;
                }

                // Check collision with player
                const dist = Math.sqrt(
                    Math.pow(beam.x - (player.x + player.width / 2), 2) +
                    Math.pow(beam.y - (player.y + player.height / 2), 2)
                );

                if (dist < beam.width + 20) {
                    lives -= (beam.damage || 1);
                    document.getElementById('lives').textContent = lives;

                    let beamColor = '#fbbf24';
                    if (beam.projectileType === 'water') beamColor = '#3b82f6';
                    else if (beam.projectileType === 'gas') beamColor = '#f59e0b';
                    else if (beam.projectileType === 'rock') beamColor = '#78716c';
                    else if (beam.projectileType === 'flag') beamColor = '#9ca3af';
                    else if (beam.isRed) beamColor = '#ef4444';
                    else if (beam.isBlue) beamColor = '#60a5fa';

                    createParticles(beam.x, beam.y, beamColor);
                    sunBeams.splice(index, 1);

                    if (lives <= 0) {
                        gameOver();
                    }
                }

                if (beam.life <= 0 || beam.x < 0 || beam.x > canvas.width ||
                    beam.y < 0 || beam.y > canvas.height) {
                    sunBeams.splice(index, 1);
                }
            });

            // Check bullet-boss collision
            if (boss) {
                bullets.forEach((bullet, bIndex) => {
                    const dist = Math.sqrt(
                        Math.pow(bullet.x - (boss.x + boss.width / 2), 2) +
                        Math.pow(bullet.y - (boss.y + boss.height / 2), 2)
                    );

                    if (dist < boss.width / 2) {
                        bullets.splice(bIndex, 1);
                        boss.health--;

                        createParticles(bullet.x, bullet.y, '#fbbf24', 10);

                        // Update health bar
                        const healthPercent = (boss.health / boss.maxHealth) * 100;
                        document.getElementById('bossHealthFill').style.width = healthPercent + '%';

                        if (boss.health <= 0) {
                            defeatBoss();
                        }
                    }
                });
            }

            // Update stars
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Update background ships
            backgroundShips.forEach(ship => {
                ship.x -= ship.speed;
                ship.y += Math.sin(ship.enginePulse * 0.4) * ship.drift * 4;
                ship.enginePulse += 0.015 + ship.depth * 0.01;
                if (ship.x < -ship.width - 150) {
                    const depth = Math.random() * 0.6 + 0.4;
                    ship.width = (120 + Math.random() * 140) * depth;
                    ship.height = (70 + Math.random() * 90) * (0.8 + depth * 0.3);
                    ship.speed = (Math.random() * 0.35 + 0.25) * (0.6 + depth) * SPEED_MULTIPLIER;
                    ship.opacity = 0.25 + depth * 0.35;
                    ship.x = canvas.width + ship.width;
                    ship.y = Math.random() * canvas.height / 2;
                    ship.type = Math.floor(Math.random() * 5);
                    ship.depth = depth;
                    ship.tilt = (Math.random() - 0.5) * 0.12;
                    ship.hullWear = Math.random() * 0.2;
                    ship.enginePulse = Math.random() * Math.PI * 2;
                    ship.drift = Math.random() * 0.08 - 0.04;
                }
            });

            // Check bullet-meteor collisions
            bullets.forEach((bullet, bIndex) => {
                meteors.forEach((meteor, mIndex) => {
                    if (bullet.x < meteor.x + meteor.width &&
                        bullet.x + bullet.width > meteor.x &&
                        bullet.y < meteor.y + meteor.height &&
                        bullet.y + bullet.height > meteor.y) {

                        bullets.splice(bIndex, 1);
                        meteor.health--;

                        if (meteor.health <= 0) {
                            if (meteor.big) {
                                score += 25;
                                explodeMeteor(meteor);
                            } else {
                                score += 5;
                                createParticles(meteor.x + meteor.width / 2, meteor.y + meteor.height / 2, '#78716c');
                            }
                            meteors.splice(mIndex, 1);
                            document.getElementById('score').textContent = score;
                        } else {
                            createParticles(bullet.x, bullet.y, '#fbbf24', 8);
                        }
                    }
                });
            });

            // Check bullet-seeking enemy collisions
            bullets.forEach((bullet, bIndex) => {
                seekingEnemies.forEach((enemy, eIndex) => {
                    if (bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y) {

                        bullets.splice(bIndex, 1);
                        enemy.health--;

                        if (enemy.health <= 0) {
                            score += 30;
                            document.getElementById('score').textContent = score;
                            createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#dc2626');
                            seekingEnemies.splice(eIndex, 1);
                        } else {
                            createParticles(bullet.x, bullet.y, '#fbbf24', 8);
                        }
                    }
                });
            });

            // Check homing missile collisions
            homingMissiles.forEach((missile, mIndex) => {
                // Check meteor collision
                meteors.forEach((meteor, metIndex) => {
                    const dist = Math.sqrt(
                        Math.pow(missile.x - (meteor.x + meteor.width / 2), 2) +
                        Math.pow(missile.y - (meteor.y + meteor.height / 2), 2)
                    );
                    if (dist < meteor.width / 2 + 10) {
                        homingMissiles.splice(mIndex, 1);
                        meteor.health--;
                        if (meteor.health <= 0) {
                            if (meteor.big) {
                                score += 25;
                                explodeMeteor(meteor);
                            } else {
                                score += 5;
                                createParticles(meteor.x + meteor.width / 2, meteor.y + meteor.height / 2, '#78716c');
                            }
                            meteors.splice(metIndex, 1);
                            document.getElementById('score').textContent = score;
                        }
                    }
                });

                // Check seeking enemy collision
                seekingEnemies.forEach((enemy, eIndex) => {
                    const dist = Math.sqrt(
                        Math.pow(missile.x - (enemy.x + enemy.width / 2), 2) +
                        Math.pow(missile.y - (enemy.y + enemy.height / 2), 2)
                    );
                    if (dist < enemy.width / 2 + 10) {
                        homingMissiles.splice(mIndex, 1);
                        enemy.health--;
                        if (enemy.health <= 0) {
                            score += 30;
                            document.getElementById('score').textContent = score;
                            createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#dc2626');
                            seekingEnemies.splice(eIndex, 1);
                        }
                    }
                });

                // Check yellow block collision
                yellowBlocks.forEach((block, bIndex) => {
                    if (missile.x > block.x && missile.x < block.x + block.width &&
                        missile.y > block.y && missile.y < block.y + block.height) {
                        homingMissiles.splice(mIndex, 1);
                        block.health--;
                        if (block.health <= 0) {
                            yellowBlocks.splice(bIndex, 1);
                            score += 15;
                            document.getElementById('score').textContent = score;
                            createParticles(block.x + block.width / 2, block.y + block.height / 2, '#fbbf24');
                        }
                    }
                });

                // Check boss collision
                if (boss) {
                    const dist = Math.sqrt(
                        Math.pow(missile.x - (boss.x + boss.width / 2), 2) +
                        Math.pow(missile.y - (boss.y + boss.height / 2), 2)
                    );
                    if (dist < boss.width / 2) {
                        homingMissiles.splice(mIndex, 1);
                        boss.health -= 2;
                        const healthPercent = (boss.health / boss.maxHealth) * 100;
                        document.getElementById('bossHealthFill').style.width = healthPercent + '%';
                        if (boss.health <= 0) {
                            defeatBoss();
                        }
                    }
                }
            });

            // Check bullet-yellow block collisions
            bullets.forEach((bullet, bIndex) => {
                yellowBlocks.forEach((block, yIndex) => {
                    if (bullet.x < block.x + block.width &&
                        bullet.x + bullet.width > block.x &&
                        bullet.y < block.y + block.height &&
                        bullet.y + bullet.height > block.y) {

                        bullets.splice(bIndex, 1);
                        block.health--;

                        if (block.health <= 0) {
                            score += 15;
                            yellowBoxesDestroyed++;
                            document.getElementById('score').textContent = score;
                            document.getElementById('boxCount').textContent = yellowBoxesDestroyed % 10;
                            createParticles(block.x + block.width / 2, block.y + block.height / 2, '#fbbf24');

                            // Every 10 boxes = all powerups
                            if (yellowBoxesDestroyed % 10 === 0) {
                                spawnAstronaut(block.x - 20, block.y);
                                spawnDashPowerup(block.x + 20, block.y);
                                spawnStarWarsCharacter(block.x, block.y - 20);
                                if (spaceshipLevel < 5) {
                                    spawnSpaceshipUpgrade(block.x, block.y + 30);
                                }
                            } else {
                                // Random powerup drop
                                const rand = Math.random();
                                if (rand < 0.05) {
                                    // 1/20 chance for Lightyear Speed
                                    spawnLightyearSpeed(block.x, block.y);
                                } else if (rand < 0.15 && spaceshipLevel < 5) {
                                    spawnSpaceshipUpgrade(block.x, block.y);
                                } else if (rand < 0.4) {
                                    spawnAstronaut(block.x, block.y);
                                } else if (rand < 0.6) {
                                    spawnDashPowerup(block.x, block.y);
                                } else if (rand < 0.75) {
                                    spawnStarWarsCharacter(block.x, block.y);
                                }
                            }

                            yellowBlocks.splice(yIndex, 1);
                        } else {
                            createParticles(bullet.x, bullet.y, '#fbbf24', 5);
                        }
                    }
                });
            });

            // Update yellow blocks
            yellowBlocks.forEach((block, index) => {
                block.y += block.speed;
                block.pulse += 0.1;

                if (block.y > canvas.height) {
                    yellowBlocks.splice(index, 1);
                }
            });

            // Update astronauts
            astronauts.forEach((astronaut, index) => {
                astronaut.y += astronaut.speed;
                astronaut.wobble += 0.05;
                astronaut.x += Math.sin(astronaut.wobble) * 1.5;

                // Check collection
                if (astronaut.x < player.x + player.width &&
                    astronaut.x + astronaut.width > player.x &&
                    astronaut.y < player.y + player.height &&
                    astronaut.y + astronaut.height > player.y) {

                    permanentBulletCount++;
                    document.getElementById('bulletCount').textContent = permanentBulletCount;
                    createParticles(astronaut.x + astronaut.width / 2, astronaut.y + astronaut.height / 2, '#60a5fa');
                    astronauts.splice(index, 1);
                }

                if (astronaut.y > canvas.height) {
                    astronauts.splice(index, 1);
                }
            });

            // Update dash powerups
            dashPowerups.forEach((powerup, index) => {
                powerup.y += powerup.speed;
                powerup.rotation += 0.1;

                // Check collection
                if (powerup.x < player.x + player.width &&
                    powerup.x + powerup.width > player.x &&
                    powerup.y < player.y + player.height &&
                    powerup.y + powerup.height > player.y) {

                    dashesAvailable++;
                    document.getElementById('dashNum').textContent = dashesAvailable;
                    document.getElementById('dashCount').style.display = 'block';
                    createParticles(powerup.x + powerup.width / 2, powerup.y + powerup.height / 2, '#60a5fa');
                    dashPowerups.splice(index, 1);
                }

                if (powerup.y > canvas.height) {
                    dashPowerups.splice(index, 1);
                }
            });

            // Update spaceship upgrades
            spaceshipUpgrades.forEach((upgrade, index) => {
                upgrade.y += upgrade.speed;
                upgrade.pulse += 0.1;

                // Check collection
                if (upgrade.x < player.x + player.width &&
                    upgrade.x + upgrade.width > player.x &&
                    upgrade.y < player.y + player.height &&
                    upgrade.y + upgrade.height > player.y) {

                    if (spaceshipLevel < 5) {
                        spaceshipLevel++;
                        player.width = 50 + (spaceshipLevel * 10);
                        player.height = 50 + (spaceshipLevel * 10);
                        document.getElementById('shipLevel').textContent = spaceshipLevel + 1;
                        createParticles(upgrade.x + upgrade.width / 2, upgrade.y + upgrade.height / 2, '#a78bfa');
                    }
                    spaceshipUpgrades.splice(index, 1);
                }

                if (upgrade.y > canvas.height) {
                    spaceshipUpgrades.splice(index, 1);
                }
            });

            // Update Star Wars characters
            starWarsCharacters.forEach((character, index) => {
                character.y += character.speed;
                character.rotation += 0.08;

                // Check collection
                if (character.x < player.x + player.width &&
                    character.x + character.width > player.x &&
                    character.y < player.y + player.height &&
                    character.y + character.height > player.y) {

                    laserBeamUpgrade = true;
                    laserBeamTimer = 600; // 10 seconds
                    createParticles(character.x + character.width / 2, character.y + character.height / 2, '#10b981');
                    starWarsCharacters.splice(index, 1);
                }

                if (character.y > canvas.height) {
                    starWarsCharacters.splice(index, 1);
                }
            });

            // Update Lightyear Speed powerups
            lightyearSpeedPowerups.forEach((powerup, index) => {
                powerup.y += powerup.speed;
                powerup.pulse += 0.15;
                powerup.rotation += 0.05;

                // Check collection
                if (powerup.x < player.x + player.width &&
                    powerup.x + powerup.width > player.x &&
                    powerup.y < player.y + player.height &&
                    powerup.y + powerup.height > player.y) {

                    // Skip to next boss immediately if not in boss fight
                    if (!bossActive && boss === null) {
                        createParticles(powerup.x + powerup.width / 2, powerup.y + powerup.height / 2, '#3b82f6', 50);
                        lightyearSpeedPowerups.splice(index, 1);

                        // Trigger boss after brief delay
                        queueNextBoss(200);
                    } else {
                        lightyearSpeedPowerups.splice(index, 1);
                    }
                }

                if (powerup.y > canvas.height) {
                    lightyearSpeedPowerups.splice(index, 1);
                }
            });

            // Update seeking enemies
            seekingEnemies.forEach((enemy, index) => {
                // Move towards player
                const dx = player.x + player.width / 2 - (enemy.x + enemy.width / 2);
                const dy = player.y + player.height / 2 - (enemy.y + enemy.height / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.y += (dy / dist) * enemy.speed;
                }

                // Check collision with player
                if (enemy.x < player.x + player.width &&
                    enemy.x + enemy.width > player.x &&
                    enemy.y < player.y + player.height &&
                    enemy.y + enemy.height > player.y) {
                    lives -= 2;
                    document.getElementById('lives').textContent = lives;
                    createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ef4444');
                    seekingEnemies.splice(index, 1);

                    if (lives <= 0) {
                        gameOver();
                    }
                }

                if (enemy.y > canvas.height + 100 || enemy.x < -100 || enemy.x > canvas.width + 100) {
                    seekingEnemies.splice(index, 1);
                }
            });

            // Update homing missiles
            homingMissiles.forEach((missile, index) => {
                // Find nearest enemy
                let nearestEnemy = null;
                let nearestDist = Infinity;

                const allEnemies = [
                    ...meteors.map(m => ({x: m.x + m.width / 2, y: m.y + m.height / 2, obj: m, type: 'meteor'})),
                    ...seekingEnemies.map(e => ({x: e.x + e.width / 2, y: e.y + e.height / 2, obj: e, type: 'seeking'})),
                    ...yellowBlocks.map(b => ({x: b.x + b.width / 2, y: b.y + b.height / 2, obj: b, type: 'block'}))
                ];

                if (boss) {
                    allEnemies.push({x: boss.x + boss.width / 2, y: boss.y + boss.height / 2, obj: boss, type: 'boss'});
                }

                allEnemies.forEach(enemy => {
                    const dx = enemy.x - missile.x;
                    const dy = enemy.y - missile.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestEnemy = enemy;
                    }
                });

                // Home in on nearest enemy
                if (nearestEnemy) {
                    const dx = nearestEnemy.x - missile.x;
                    const dy = nearestEnemy.y - missile.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        missile.vx = (dx / dist) * missile.speed;
                        missile.vy = (dy / dist) * missile.speed;
                    }
                }

                missile.x += missile.vx;
                missile.y += missile.vy;

                if (missile.y < -missile.height || missile.x < 0 || missile.x > canvas.width) {
                    homingMissiles.splice(index, 1);
                }
            });

            // Update unicorns (only spawn when not in boss fight)
            unicorns.forEach((unicorn, index) => {
                unicorn.y += unicorn.speed;
                unicorn.wobble += 0.05;
                unicorn.x += Math.sin(unicorn.wobble) * 2;

                if (unicorn.x < player.x + player.width &&
                    unicorn.x + unicorn.width > player.x &&
                    unicorn.y < player.y + player.height &&
                    unicorn.y + unicorn.height > player.y) {

                    const points = unicorn.golden ? 50 : 10;
                    score += points;
                    document.getElementById('score').textContent = score;
                    createParticles(unicorn.x + unicorn.width / 2, unicorn.y + unicorn.height / 2,
                                  unicorn.golden ? '#fbbf24' : '#fce7f3');
                    unicorns.splice(index, 1);
                }

                if (unicorn.y > canvas.height) {
                    unicorns.splice(index, 1);
                }
            });

            // Update meteors
            meteors.forEach((meteor, index) => {
                meteor.y += meteor.speed;
                meteor.rotation += meteor.rotationSpeed;

                if (meteor.vx) {
                    meteor.x += meteor.vx;
                    meteor.vx *= 0.98;
                }

                if (meteor.x < player.x + player.width &&
                    meteor.x + meteor.width > player.x &&
                    meteor.y < player.y + player.height &&
                    meteor.y + meteor.height > player.y) {
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    createParticles(meteor.x + meteor.width / 2, meteor.y + meteor.height / 2, '#ef4444');
                    meteors.splice(index, 1);

                    if (lives <= 0) {
                        gameOver();
                    }
                }

                if (meteor.y > canvas.height || meteor.x < -100 || meteor.x > canvas.width + 100) {
                    meteors.splice(index, 1);
                }
            });

            // Update particles
            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy += 0.2;
                particle.life -= 0.02;

                if (particle.life <= 0) {
                    particles.splice(index, 1);
                }
            });

            // Spawn new entities (difficulty modifiers)
            let unicornRate = 0.02;
            let meteorRate = 0.018;
            let seekingRate = 0.005;
            let yellowBlockRate = 0.008;

            if (difficulty === 'easy') {
                meteorRate = 0.01;
                seekingRate = 0.002;
            } else if (difficulty === 'hard') {
                unicornRate = 0.015;
                meteorRate = 0.03;
                seekingRate = 0.015;
                yellowBlockRate = 0.006;
            }

            // Progressive difficulty - game gets harder over time
            const progressMultiplier = 1 + (bossesDefeated * 0.1);
            meteorRate *= progressMultiplier;
            seekingRate *= progressMultiplier;
            unicornRate *= SPEED_MULTIPLIER;
            meteorRate *= SPEED_MULTIPLIER;
            seekingRate *= SPEED_MULTIPLIER;
            yellowBlockRate *= SPEED_MULTIPLIER;

            if (!bossActive && !boss && !bossSpawnPending && score >= nextBossScore) {
                queueNextBoss(200);
            }

            if (!bossActive) {
                if (Math.random() < unicornRate) spawnUnicorn();
                if (Math.random() < meteorRate) spawnMeteor();

                // Spawn seeking enemies based on difficulty (more bullets = scarier enemies)
                const seekingChance = seekingRate + (permanentBulletCount * 0.003);
                if (Math.random() < seekingChance) spawnSeekingEnemy();
            }

            // Yellow blocks spawn both in normal and boss battles
            if (Math.random() < yellowBlockRate) spawnYellowBlock();
        }

        // Draw background ship
        function drawBackgroundShip(ship) {
            ctx.save();
            ctx.globalAlpha = ship.opacity;
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.tilt + Math.sin(ship.enginePulse * 0.2) * 0.01);

            const engineGlow = Math.sin(Date.now() * 0.003 + ship.enginePulse) * 0.4 + 0.6;
            const engineFlicker = Math.random() * 0.2 + 0.8;

            if (ship.type === 0) {
                // Millennium Falcon - ultra detailed
                // Main disc body
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, ship.width * 0.4);
                gradient.addColorStop(0, '#b4b8c1');
                gradient.addColorStop(0.6, '#8b92a3');
                gradient.addColorStop(1, '#6b7280');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.ellipse(0, 0, ship.width * 0.4, ship.height * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();

                // Panel details
                ctx.strokeStyle = '#6b7280';
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-ship.width * 0.3, -ship.height * 0.2 + i * ship.height * 0.12);
                    ctx.lineTo(ship.width * 0.2, -ship.height * 0.2 + i * ship.height * 0.12);
                    ctx.stroke();
                }

                // Cockpit tube (offset to right side)
                ctx.fillStyle = '#4b5563';
                ctx.beginPath();
                ctx.ellipse(ship.width * 0.25, -ship.height * 0.05, ship.width * 0.12, ship.height * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Cockpit windows
                ctx.fillStyle = '#1e3a5f';
                ctx.beginPath();
                ctx.ellipse(ship.width * 0.28, -ship.height * 0.08, ship.width * 0.05, ship.height * 0.05, 0, 0, Math.PI * 2);
                ctx.fill();

                // Front mandibles
                ctx.fillStyle = '#8b92a3';
                // Upper mandible
                ctx.beginPath();
                ctx.moveTo(-ship.width * 0.4, -ship.height * 0.15);
                ctx.lineTo(-ship.width * 0.5, -ship.height * 0.35);
                ctx.lineTo(-ship.width * 0.45, -ship.height * 0.35);
                ctx.lineTo(-ship.width * 0.35, -ship.height * 0.15);
                ctx.closePath();
                ctx.fill();
                // Lower mandible
                ctx.beginPath();
                ctx.moveTo(-ship.width * 0.4, ship.height * 0.15);
                ctx.lineTo(-ship.width * 0.5, ship.height * 0.35);
                ctx.lineTo(-ship.width * 0.45, ship.height * 0.35);
                ctx.lineTo(-ship.width * 0.35, ship.height * 0.15);
                ctx.closePath();
                ctx.fill();

                // Engine glow - dual engines
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#60a5fa';
                ctx.fillStyle = `rgba(96, 165, 250, ${engineGlow * engineFlicker})`;
                ctx.beginPath();
                ctx.ellipse(ship.width * 0.35, -ship.height * 0.1, ship.width * 0.06, ship.height * 0.09, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(ship.width * 0.35, ship.height * 0.1, ship.width * 0.06, ship.height * 0.09, 0, 0, Math.PI * 2);
                ctx.fill();

                // Engine core glow
                ctx.fillStyle = `rgba(255, 255, 255, ${engineGlow})`;
                ctx.beginPath();
                ctx.ellipse(ship.width * 0.35, -ship.height * 0.1, ship.width * 0.03, ship.height * 0.05, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(ship.width * 0.35, ship.height * 0.1, ship.width * 0.03, ship.height * 0.05, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Antenna details
                ctx.strokeStyle = '#6b7280';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-ship.width * 0.2, -ship.height * 0.2);
                ctx.lineTo(-ship.width * 0.25, -ship.height * 0.35);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ship.width * 0.1, ship.height * 0.15);
                ctx.lineTo(ship.width * 0.15, ship.height * 0.3);
                ctx.stroke();

            } else if (ship.type === 1) {
                // Star Destroyer - detailed
                // Main hull gradient
                const hullGradient = ctx.createLinearGradient(-ship.width * 0.5, 0, ship.width * 0.5, 0);
                hullGradient.addColorStop(0, '#6b7280');
                hullGradient.addColorStop(0.5, '#9ca3af');
                hullGradient.addColorStop(1, '#d1d5db');
                ctx.fillStyle = hullGradient;

                // Main triangular wedge
                ctx.beginPath();
                ctx.moveTo(ship.width * 0.5, 0);
                ctx.lineTo(-ship.width * 0.5, -ship.height * 0.45);
                ctx.lineTo(-ship.width * 0.5, ship.height * 0.45);
                ctx.closePath();
                ctx.fill();

                // Surface details
                ctx.strokeStyle = '#6b7280';
                ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-ship.width * 0.4 + i * ship.width * 0.2, -ship.height * 0.3);
                    ctx.lineTo(-ship.width * 0.4 + i * ship.width * 0.2, ship.height * 0.3);
                    ctx.stroke();
                }

                // Bridge tower
                ctx.fillStyle = '#4b5563';
                ctx.fillRect(-ship.width * 0.35, -ship.height * 0.25, ship.width * 0.15, ship.height * 0.5);
                ctx.fillRect(-ship.width * 0.32, -ship.height * 0.3, ship.width * 0.12, ship.height * 0.15);

                // Bridge windows
                ctx.fillStyle = '#1e3a5f';
                for (let i = 0; i < 4; i++) {
                    ctx.fillRect(-ship.width * 0.3 + i * ship.width * 0.025, -ship.height * 0.25, ship.width * 0.02, ship.height * 0.08);
                }

                // Engine glows - more realistic with trails
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ef4444';
                const engineY = ship.height * 0.3;
                for (let i = 0; i < 3; i++) {
                    // Main engine glow
                    ctx.fillStyle = `rgba(239, 68, 68, ${engineGlow * engineFlicker})`;
                    ctx.beginPath();
                    ctx.arc(-ship.width * 0.45 + i * ship.width * 0.05, -engineY + i * ship.height * 0.15, ship.width * 0.04, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(-ship.width * 0.45 + i * ship.width * 0.05, engineY - i * ship.height * 0.15, ship.width * 0.04, 0, Math.PI * 2);
                    ctx.fill();

                    // Engine core (white hot center)
                    ctx.fillStyle = `rgba(255, 255, 255, ${engineGlow})`;
                    ctx.beginPath();
                    ctx.arc(-ship.width * 0.45 + i * ship.width * 0.05, -engineY + i * ship.height * 0.15, ship.width * 0.02, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(-ship.width * 0.45 + i * ship.width * 0.05, engineY - i * ship.height * 0.15, ship.width * 0.02, 0, Math.PI * 2);
                    ctx.fill();

                    // Engine trails
                    const trailGradient = ctx.createLinearGradient(
                        -ship.width * 0.45 + i * ship.width * 0.05,
                        0,
                        -ship.width * 0.6 + i * ship.width * 0.05,
                        0
                    );
                    trailGradient.addColorStop(0, `rgba(239, 68, 68, ${engineGlow * 0.5})`);
                    trailGradient.addColorStop(1, 'rgba(239, 68, 68, 0)');
                    ctx.fillStyle = trailGradient;
                    ctx.fillRect(
                        -ship.width * 0.6 + i * ship.width * 0.05,
                        -engineY + i * ship.height * 0.15 - ship.width * 0.02,
                        ship.width * 0.15,
                        ship.width * 0.04
                    );
                    ctx.fillRect(
                        -ship.width * 0.6 + i * ship.width * 0.05,
                        engineY - i * ship.height * 0.15 - ship.width * 0.02,
                        ship.width * 0.15,
                        ship.width * 0.04
                    );
                }
                ctx.shadowBlur = 0;

                // Communication array
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-ship.width * 0.25, -ship.height * 0.35);
                ctx.lineTo(-ship.width * 0.25, -ship.height * 0.45);
                ctx.stroke();
                ctx.fillStyle = '#6b7280';
                ctx.beginPath();
                ctx.arc(-ship.width * 0.25, -ship.height * 0.45, ship.width * 0.03, 0, Math.PI * 2);
                ctx.fill();

            } else if (ship.type === 2) {
                // X-Wing fighter - enhanced
                // Main fuselage with gradient
                const xwingGrad = ctx.createLinearGradient(0, -ship.height * 0.08, 0, ship.height * 0.08);
                xwingGrad.addColorStop(0, '#b4b8c1');
                xwingGrad.addColorStop(0.5, '#9ca3af');
                xwingGrad.addColorStop(1, '#8b92a3');
                ctx.fillStyle = xwingGrad;
                ctx.fillRect(-ship.width * 0.15, -ship.height * 0.08, ship.width * 0.45, ship.height * 0.16);

                // Panel details on fuselage
                ctx.strokeStyle = '#6b7280';
                ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-ship.width * 0.1 + i * ship.width * 0.1, -ship.height * 0.08);
                    ctx.lineTo(-ship.width * 0.1 + i * ship.width * 0.1, ship.height * 0.08);
                    ctx.stroke();
                }

                // Nose cone
                ctx.fillStyle = '#d1d5db';
                ctx.beginPath();
                ctx.moveTo(ship.width * 0.3, 0);
                ctx.lineTo(ship.width * 0.15, -ship.height * 0.08);
                ctx.lineTo(ship.width * 0.15, ship.height * 0.08);
                ctx.closePath();
                ctx.fill();

                // Laser cannons on nose
                ctx.fillStyle = '#6b7280';
                ctx.fillRect(ship.width * 0.28, -ship.height * 0.03, ship.width * 0.08, ship.height * 0.025);
                ctx.fillRect(ship.width * 0.28, ship.height * 0.005, ship.width * 0.08, ship.height * 0.025);

                // Cockpit with shine
                const cockpitGrad = ctx.createRadialGradient(
                    ship.width * 0.05, -ship.height * 0.03, 0,
                    ship.width * 0.05, 0, ship.width * 0.08
                );
                cockpitGrad.addColorStop(0, '#60a5fa');
                cockpitGrad.addColorStop(0.5, '#3b82f6');
                cockpitGrad.addColorStop(1, '#1e3a5f');
                ctx.fillStyle = cockpitGrad;
                ctx.beginPath();
                ctx.ellipse(ship.width * 0.05, 0, ship.width * 0.07, ship.height * 0.11, 0, 0, Math.PI * 2);
                ctx.fill();

                // Cockpit reflection
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.ellipse(ship.width * 0.06, -ship.height * 0.04, ship.width * 0.03, ship.height * 0.04, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // S-foils (X-wings) with more detail
                ctx.strokeStyle = '#8b92a3';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';

                // Draw wing surfaces
                ctx.fillStyle = '#9ca3af';
                // Top-left wing
                ctx.beginPath();
                ctx.moveTo(-ship.width * 0.1, -ship.height * 0.08);
                ctx.lineTo(-ship.width * 0.3, -ship.height * 0.4);
                ctx.lineTo(-ship.width * 0.32, -ship.height * 0.38);
                ctx.lineTo(-ship.width * 0.12, -ship.height * 0.06);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Top-right wing
                ctx.beginPath();
                ctx.moveTo(-ship.width * 0.1, ship.height * 0.08);
                ctx.lineTo(-ship.width * 0.3, ship.height * 0.4);
                ctx.lineTo(-ship.width * 0.32, ship.height * 0.38);
                ctx.lineTo(-ship.width * 0.12, ship.height * 0.06);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Bottom wings (crossed behind)
                ctx.globalAlpha = ship.opacity * 0.7;
                ctx.fillStyle = '#6b7280';
                // Bottom-left wing
                ctx.beginPath();
                ctx.moveTo(-ship.width * 0.1, -ship.height * 0.08);
                ctx.lineTo(-ship.width * 0.25, -ship.height * 0.25);
                ctx.lineTo(-ship.width * 0.27, -ship.height * 0.23);
                ctx.lineTo(-ship.width * 0.12, -ship.height * 0.06);
                ctx.closePath();
                ctx.fill();

                // Bottom-right wing
                ctx.beginPath();
                ctx.moveTo(-ship.width * 0.1, ship.height * 0.08);
                ctx.lineTo(-ship.width * 0.25, ship.height * 0.25);
                ctx.lineTo(-ship.width * 0.27, ship.height * 0.23);
                ctx.lineTo(-ship.width * 0.12, ship.height * 0.06);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = ship.opacity;

                // Engine glows (4 engines) with trails
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#f59e0b';

                const enginePositions = [
                    {x: -ship.width * 0.3, y: -ship.height * 0.4},
                    {x: -ship.width * 0.3, y: ship.height * 0.4},
                    {x: -ship.width * 0.25, y: -ship.height * 0.25},
                    {x: -ship.width * 0.25, y: ship.height * 0.25}
                ];

                enginePositions.forEach(pos => {
                    // Engine glow
                    ctx.fillStyle = `rgba(245, 158, 11, ${engineGlow * engineFlicker})`;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ship.width * 0.03, 0, Math.PI * 2);
                    ctx.fill();

                    // Hot core
                    ctx.fillStyle = `rgba(255, 255, 255, ${engineGlow})`;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ship.width * 0.015, 0, Math.PI * 2);
                    ctx.fill();

                    // Engine trail
                    const trailGrad = ctx.createLinearGradient(pos.x, 0, pos.x - ship.width * 0.1, 0);
                    trailGrad.addColorStop(0, `rgba(245, 158, 11, ${engineGlow * 0.3})`);
                    trailGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
                    ctx.fillStyle = trailGrad;
                    ctx.fillRect(pos.x - ship.width * 0.1, pos.y - ship.width * 0.015, ship.width * 0.1, ship.width * 0.03);
                });

                ctx.shadowBlur = 0;

                // R2 unit astromech
                ctx.fillStyle = '#e0e7ff';
                ctx.beginPath();
                ctx.arc(-ship.width * 0.02, 0, ship.width * 0.04, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(-ship.width * 0.04, -ship.height * 0.02, ship.width * 0.04, ship.height * 0.04);
                ctx.fillStyle = '#1e3a5f';
                ctx.beginPath();
                ctx.arc(-ship.width * 0.02, -ship.height * 0.01, ship.width * 0.015, 0, Math.PI * 2);
                ctx.fill();

            } else if (ship.type === 4) {
                // Corellian Corvette / Blockade Runner
                // Long cylindrical ship
                const corvGradient = ctx.createLinearGradient(-ship.width * 0.5, -ship.height * 0.3, -ship.width * 0.5, ship.height * 0.3);
                corvGradient.addColorStop(0, '#e5e7eb');
                corvGradient.addColorStop(0.5, '#f3f4f6');
                corvGradient.addColorStop(1, '#d1d5db');
                ctx.fillStyle = corvGradient;

                // Main hull
                ctx.beginPath();
                ctx.moveTo(ship.width * 0.4, 0);
                ctx.lineTo(ship.width * 0.2, -ship.height * 0.25);
                ctx.lineTo(-ship.width * 0.5, -ship.height * 0.3);
                ctx.lineTo(-ship.width * 0.5, ship.height * 0.3);
                ctx.lineTo(ship.width * 0.2, ship.height * 0.25);
                ctx.closePath();
                ctx.fill();

                // Hull detail lines
                ctx.strokeStyle = '#9ca3af';
                ctx.lineWidth = 1;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-ship.width * 0.4 + i * ship.width * 0.15, -ship.height * 0.28);
                    ctx.lineTo(-ship.width * 0.4 + i * ship.width * 0.15, ship.height * 0.28);
                    ctx.stroke();
                }

                // Command module on top
                ctx.fillStyle = '#9ca3af';
                ctx.fillRect(-ship.width * 0.1, -ship.height * 0.35, ship.width * 0.2, ship.height * 0.15);
                ctx.fillStyle = '#6b7280';
                ctx.fillRect(-ship.width * 0.05, -ship.height * 0.4, ship.width * 0.15, ship.height * 0.1);

                // Windows
                ctx.fillStyle = '#1e3a5f';
                for (let i = 0; i < 6; i++) {
                    ctx.fillRect(-ship.width * 0.35 + i * ship.width * 0.12, -ship.height * 0.15, ship.width * 0.03, ship.height * 0.06);
                    ctx.fillRect(-ship.width * 0.35 + i * ship.width * 0.12, ship.height * 0.09, ship.width * 0.03, ship.height * 0.06);
                }

                // Engine cluster
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#3b82f6';
                const engineCount = 4;
                for (let i = 0; i < engineCount; i++) {
                    const engineX = -ship.width * 0.5;
                    const engineY = -ship.height * 0.2 + (i * ship.height * 0.13);

                    ctx.fillStyle = `rgba(59, 130, 246, ${engineGlow * engineFlicker})`;
                    ctx.beginPath();
                    ctx.ellipse(engineX, engineY, ship.width * 0.04, ship.height * 0.05, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = `rgba(255, 255, 255, ${engineGlow})`;
                    ctx.beginPath();
                    ctx.ellipse(engineX, engineY, ship.width * 0.02, ship.height * 0.025, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Engine trails
                    const trailGrad = ctx.createLinearGradient(engineX, 0, engineX - ship.width * 0.15, 0);
                    trailGrad.addColorStop(0, `rgba(59, 130, 246, ${engineGlow * 0.4})`);
                    trailGrad.addColorStop(1, 'rgba(59, 130, 246, 0)');
                    ctx.fillStyle = trailGrad;
                    ctx.fillRect(engineX - ship.width * 0.15, engineY - ship.height * 0.025, ship.width * 0.15, ship.height * 0.05);
                }
                ctx.shadowBlur = 0;

                // Antenna array
                ctx.strokeStyle = '#6b7280';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ship.width * 0.1, -ship.height * 0.3);
                ctx.lineTo(ship.width * 0.1, -ship.height * 0.45);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ship.width * 0.05, -ship.height * 0.45);
                ctx.lineTo(ship.width * 0.15, -ship.height * 0.45);
                ctx.stroke();

            } else if (ship.type === 3) {
                // TIE Fighter
                // Hexagonal wings
                ctx.fillStyle = '#6b7280';
                // Left wing
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i;
                    const x = -ship.width * 0.25 + Math.cos(angle) * ship.width * 0.15;
                    const y = Math.sin(angle) * ship.height * 0.3;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();

                // Right wing
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i;
                    const x = ship.width * 0.25 + Math.cos(angle) * ship.width * 0.15;
                    const y = Math.sin(angle) * ship.height * 0.3;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();

                // Wing panels
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-ship.width * 0.35, -ship.height * 0.2 + i * ship.height * 0.2);
                    ctx.lineTo(-ship.width * 0.15, -ship.height * 0.2 + i * ship.height * 0.2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(ship.width * 0.35, -ship.height * 0.2 + i * ship.height * 0.2);
                    ctx.lineTo(ship.width * 0.15, -ship.height * 0.2 + i * ship.height * 0.2);
                    ctx.stroke();
                }

                // Spherical cockpit
                const cockpitGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, ship.height * 0.15);
                cockpitGradient.addColorStop(0, '#8b92a3');
                cockpitGradient.addColorStop(0.7, '#6b7280');
                cockpitGradient.addColorStop(1, '#4b5563');
                ctx.fillStyle = cockpitGradient;
                ctx.beginPath();
                ctx.arc(0, 0, ship.height * 0.15, 0, Math.PI * 2);
                ctx.fill();

                // Cockpit window
                ctx.fillStyle = '#1e3a5f';
                ctx.beginPath();
                ctx.arc(ship.width * 0.02, 0, ship.height * 0.08, 0, Math.PI * 2);
                ctx.fill();

                // Engine glow (center rear)
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#10b981';
                ctx.fillStyle = `rgba(16, 185, 129, ${engineGlow})`;
                ctx.beginPath();
                ctx.arc(-ship.width * 0.05, 0, ship.width * 0.04, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Shared lighting and detail to keep all ships grounded in the scene
            const hullLight = ctx.createLinearGradient(
                -ship.width * 0.6, -ship.height * 0.6,
                ship.width * 0.6, ship.height * 0.6
            );
            hullLight.addColorStop(0, `rgba(255, 255, 255, ${0.05 + ship.depth * 0.08})`);
            hullLight.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
            hullLight.addColorStop(1, `rgba(0, 0, 0, ${0.12 + ship.hullWear})`);
            ctx.fillStyle = hullLight;
            ctx.fillRect(-ship.width * 0.6, -ship.height * 0.6, ship.width * 1.2, ship.height * 1.2);

            // Small navigation beacons
            const navBlink = Math.sin(ship.enginePulse * 2) * 0.5 + 0.5;
            ctx.fillStyle = `rgba(239, 68, 68, ${0.35 + navBlink * 0.4})`;
            ctx.beginPath();
            ctx.arc(ship.width * 0.45, -ship.height * 0.2, ship.width * 0.02, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = `rgba(59, 130, 246, ${0.35 + (1 - navBlink) * 0.35})`;
            ctx.beginPath();
            ctx.arc(ship.width * 0.45, ship.height * 0.2, ship.width * 0.02, 0, Math.PI * 2);
            ctx.fill();

            // Subtle wear lines
            const originalAlpha = ctx.globalAlpha;
            ctx.globalAlpha = Math.min(ship.hullWear + 0.15, 0.5);
            ctx.strokeStyle = 'rgba(17, 24, 39, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-ship.width * 0.25, -ship.height * 0.18);
            ctx.lineTo(ship.width * 0.05, -ship.height * 0.06);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-ship.width * 0.2, ship.height * 0.15);
            ctx.lineTo(ship.width * 0.1, ship.height * 0.05);
            ctx.stroke();
            ctx.globalAlpha = originalAlpha;

            ctx.globalAlpha = 1;
            ctx.restore();
        }

        // Draw game
        function draw() {
            ctx.fillStyle = 'rgba(10, 14, 39, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Milky Way
            milkyWayStars.forEach(star => {
                const twinkle = Math.sin(Date.now() * 0.001 + star.twinkle) * 0.3 + 0.7;
                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.opacity * twinkle;
                ctx.shadowBlur = star.size * 2;
                ctx.shadowColor = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Draw background ships
            backgroundShips.forEach(drawBackgroundShip);

            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            bullets.forEach(drawBullet);
            sunBeams.forEach(drawSunBeam);

            particles.forEach(particle => {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            unicorns.forEach(drawUnicorn);
            meteors.forEach(drawMeteor);
            yellowBlocks.forEach(drawYellowBlock);
            astronauts.forEach(drawAstronaut);
            dashPowerups.forEach(drawDashPowerup);
            spaceshipUpgrades.forEach(drawSpaceshipUpgrade);
            starWarsCharacters.forEach(drawStarWarsCharacter);
            lightyearSpeedPowerups.forEach(drawLightyearSpeed);
            seekingEnemies.forEach(drawSeekingEnemy);
            homingMissiles.forEach(drawHomingMissile);

            if (boss) drawBoss();

            drawPlayer();
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Game over (endless mode - respawn)
        function gameOver() {
            // In endless mode, lose some score and respawn
            const scorePenalty = Math.floor(score * 0.2);
            score = Math.max(0, score - scorePenalty);
            document.getElementById('score').textContent = score;

            // Reset lives
            if (difficulty === 'easy') {
                lives = 500;
            } else if (difficulty === 'medium') {
                lives = 300;
            } else if (difficulty === 'hard') {
                lives = 150;
            }
            document.getElementById('lives').textContent = lives;

            // Clear enemies
            meteors = [];
            seekingEnemies = [];
            sunBeams = [];

            // Flash screen
            createParticles(canvas.width / 2, canvas.height / 2, '#ef4444', 100);

            // Respawn player
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 80;

            // Brief invincibility by clearing nearby enemies
            setTimeout(() => {
                meteors = meteors.filter(m => {
                    const dist = Math.sqrt(Math.pow(m.x - player.x, 2) + Math.pow(m.y - player.y, 2));
                    return dist > 200;
                });
            }, 100);
        }

        // Restart game
        document.getElementById('restartBtn').addEventListener('click', () => {
            // Clear any pending boss shoot timeouts
            bossShootTimeouts.forEach(timeout => clearTimeout(timeout));
            bossShootTimeouts = [];

            score = 0;
            lives = 300;
            unicorns = [];
            meteors = [];
            particles = [];
            bullets = [];
            sunBeams = [];
            yellowBlocks = [];
            astronauts = [];
            dashPowerups = [];
            spaceshipUpgrades = [];
            starWarsCharacters = [];
            lightyearSpeedPowerups = [];
            seekingEnemies = [];
            homingMissiles = [];
            gameRunning = false;
            canShoot = true;
            bossActive = false;
            boss = null;
            permanentBulletCount = 1;
            dashesAvailable = 0;
            yellowBoxesDestroyed = 0;
            spaceshipLevel = 0;
            bossesDefeated = 0;
            nextBossScore = 150;
            laserBeamUpgrade = false;
            laserBeamTimer = 0;
            difficulty = null;
            forcedBossType = null;
            bossSpawnPending = false;
            if (bossSpawnTimer) {
                clearTimeout(bossSpawnTimer);
                bossSpawnTimer = null;
            }
            player.width = 50;
            player.height = 50;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('bulletCount').textContent = permanentBulletCount;
            document.getElementById('shipLevel').textContent = 1;
            document.getElementById('boxCount').textContent = 0;
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('bossHealth').style.display = 'none';
            document.getElementById('dashCount').style.display = 'none';
            document.getElementById('difficultySelect').style.display = 'block';
            gameContainer.classList.remove('fullscreen');
            resizeCanvas();
            createStars();
            createBackgroundShips();
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
        });

        // Start game
        gameLoop();
    </script>
</body>
</html>

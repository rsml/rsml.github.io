<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santa Rooftop Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <h1>Santa Rooftop Run</h1>
    <p class="instructions">
      Arrow keys move, up jumps. Dodge snowballs. Touching a snowball costs a life. Touching the snowman sends you back. Reach the home chimney, drop the presents, and watch the unicorns celebrate.
    </p>
    <div class="status">
      <span id="lives"></span>
      <span id="status-text"></span>
    </div>
  </div>
  <canvas id="game" width="900" height="520"></canvas>
  <script src="main.js"></script>
</body>
</html>

# ─────────────────────────────────────────────────────────────────────────────
#  PORTFOLIO CONTENT: the single place to edit projects.
#
#  This file is the source of truth for every project's title, subtitle, role,
#  links, and gallery assets. `src/data/work.ts` loads it, validates it against a
#  schema (so a typo fails the build with a clear message), and hands it to the
#  home page, the case-study pages, the work rows, and the lightbox.
#
#  ORDER: projects appear on the page in the order they are listed here. To
#  reorder the home page, move a block up or down. Nothing else to change.
#
#  FIELDS (per project)
#    slug          required  url + getStaticPaths id (e.g. /work/<slug>/). unique.
#    title         required  full document/page title.
#    cardTitle     required  label on the home row / lightbox (may be shorter).
#    role          required  the eyebrow line ("Creator", "Founder, CTO", …).
#    subtitle      required  short "what it is", shown after the title.
#    date          optional  freeform display date ("2024", "2018-present"),
#                            shown after the role in the row eyebrow.
#    cardDesc      required  the case-study page's <meta name="description">
#                            (SEO + link previews). Not rendered on any page.
#    blurb         required  one-sentence explainer. Currently used by NOTHING
#                            (kept for reuse; a candidate for removal).
#    device        required  iphone | desktop | ipad, rounds thumbnails/lightbox
#                            images like the real screen (radii in global.css).
#    thumbClass    required  e.g. thumb-chord, selects the Thumb.astro variant.
#    thumbImage    optional  app-icon shown in row/lightbox/case-study headers.
#    transition    required  ripple | fade-slide (ripple is chord-colors only).
#    deepDive      optional  true → prepend a "Deep dive" link to /work/<slug>/.
#    marketingUrl  optional  shows a "Visit …" button on the case-study page.
#    marketingLabel optional label for that button (default "Visit site").
#    appStoreUrl   optional  shows the Apple "Download on the App Store" badge.
#    ripple        optional  shader params for the ripple transition (chord only).
#
#    links: a list of { label, href }. The arrow (→ internal vs ↗ external) and
#    new-tab behaviour are DERIVED from the href, so just paste the URL:
#      href starting with "/"    → internal page, renders "→".
#      href starting with "http" → external link, renders "↗", opens in a new tab.
#
#    assets: the gallery shown in the home row's strip and the lightbox. Each is
#    { type, src, alt, orientation, poster? }. `orientation` (portrait|landscape)
#    drives the strip sizing and lightbox framing, so keep a project's assets
#    homogeneous. Supported `type` values (default: image):
#      image   a PNG/JPG screenshot.           <img>.            poster: ignored.
#      gif     an animated GIF (autoplays).    <img>.            poster optional
#                                                                (static strip thumb).
#      video   an MP4/WebM. Rendered with the  <video> + Plyr.   poster REQUIRED
#              Plyr player (custom controls,                     (strip thumbnail +
#              fullscreen, mobile-friendly).                     play poster).
#      youtube a YouTube video, by URL or id   Plyr (youtube     poster auto from
#              (.../embed/ID, or just ID).     provider).        the id (override
#                                                                with poster: ...).
#      embed   a live web view / interactive   <iframe>, lazy-   poster REQUIRED
#              demo (any URL). Loads only when  loaded only when  (a live page can't
#              its project is open in the box.  on-screen.        be a strip thumb).
#      pdf     a PDF document, shown in the     <iframe>, lazy-   poster REQUIRED
#              browser's native PDF viewer.     loaded like       (pnpm editor renders
#                                               embed.            one from page 1).
# ─────────────────────────────────────────────────────────────────────────────

